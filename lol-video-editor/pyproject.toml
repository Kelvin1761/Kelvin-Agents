[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-video-editor"
version = "0.1.0"
description = "Local, reviewable League of Legends highlights and Shorts"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<6", "faster-whisper>=1.1,<2", "opencc-python-reimplemented>=0.1.7,<1", "imageio-ffmpeg>=0.6,<1"]

[project.optional-dependencies]
whisper = ["openai-whisper>=20240930"]

[project.scripts]
lol-edit = "lol_editor.cli:main"

[tool.setuptools.package-data]
lol_editor = ["review.html"]
