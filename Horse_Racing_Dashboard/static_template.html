function dataReadoutTone(band) {
  const value = String(band || '');
  if (/[✅↑＋+]/.test(value)) return 'positive';
  if (/[⚠❌↓]/.test(value)) return 'warning';
  return 'neutral';
}

function dataReadoutSummary(rows) {
  const positive = rows.filter(row => dataReadoutTone(row.band) === 'positive').length;
  const warnings = rows.filter(row => dataReadoutTone(row.band) === 'warning').length;
  return [positive ? `${positive} 優勢` : '', warnings ? `${warnings} 注意` : '', `${rows.length} 項資料`]
    .filter(Boolean)
    .join(' · ');
}

function dataReadoutReasonLines(row) {
  let reason = String(row?.reason || '').trim();
  if (!reason) return [];
  reason = reason
    .replace(/[，,]\s*拍檔(?=\d+仗勝率)/g, '；騎練拍檔')
    .replace(/(^|[；;])\s*拍檔(?=\d+仗勝率)/g, '$1騎練拍檔');
  const isEquipment = String(row?.label || '').includes('配備變動');
  // The equipment value is already the complete user-facing summary. Raw HKJC
  // transitions add no information and may contain placeholders such as "--".
  if (isEquipment) return [];
  return reason
    .split(/[；;]/)
    .map(line => line.trim())
    .filter(Boolean);
}

function sanitizeEquipmentDisplayText(value) {
  return String(value || '')
    .split(/[；;]/)
    .map(part => part.trim())
    .filter(part => part && !/^(?:戴上|除下|維持)\s*[-‐‑‒–—]+$/.test(part))
    .join('；');
}

function renderDataReadoutItem(row) {
  const band = row.band || '➖';
  const tone = dataReadoutTone(band);
  const isEquipment = String(row?.label || '').includes('配備變動');
  let displayValue = isEquipment ? sanitizeEquipmentDisplayText(row.value) : row.value;
  if (String(row?.label || '').includes('段速趨勢') && !/最舊\s/.test(String(displayValue || ''))) {
    const endpointMatch = String(displayValue || '').match(/^\s*([+-]?\d+(?:\.\d+)?)\s*→\s*([+-]?\d+(?:\.\d+)?)s?\s*$/i);
    if (endpointMatch) displayValue = `最舊 ${endpointMatch[2]}s → 最新 ${endpointMatch[1]}s`;
  }
  const main = [displayValue, row.trend].filter(Boolean).join(' · ') || '—';
  const reasonLines = dataReadoutReasonLines(row);
  return `<div class="data-readout__item">
    <span class="data-readout__signal data-readout__signal--${tone}" aria-hidden="true">${esc(band)}</span>
    <div class="data-readout__content">
      <div class="data-readout__line"><span class="data-readout__label">${esc(row.label || '數據')}</span><strong class="data-readout__value">${esc(main)}</strong></div>
      ${reasonLines.length ? `<div class="data-readout__reason">${reasonLines.map(line => `<span>${esc(line)}</span>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

function dataReadoutGroup(row) {
  const label = String(row?.label || '');
  if (/六維排名綜合|主要支柱|最弱環節|數據信心/.test(label)) return '模型摘要';
  if (/騎練|騎師|練馬師|人馬配搭/.test(label)) return '騎練';
  if (/狀態|穩定|近績|賽績線|試閘|備戰|健康|信心/.test(label)) return '狀態與賽績';
  if (/場地|地況|L600|速度考驗|段速/.test(label)) return '場地與環境';
  if (/檔位|步速|跑法|形勢|走位/.test(label)) return '賽事形勢';
  if (/級數|Rating|評分|負磅|路程|距離|班次/.test(label)) return '能力與級數';
  return '其他資料';
}

function renderDataReadout(rows) {
  const source = Array.isArray(rows) ? rows.filter(Boolean) : [];
  if (!source.length) return '';
  const order = ['模型摘要', '騎練', '狀態與賽績', '場地與環境', '賽事形勢', '能力與級數', '其他資料'];
  const grouped = new Map();
  source.forEach(row => {
    const group = dataReadoutGroup(row);
    if (!grouped.has(group)) grouped.set(group, []);
    grouped.get(group).push(row);
  });
  let html = '<div class="data-readout data-readout--complete">';
  html += `<div class="data-readout__header"><div class="data-readout__title">📊 數據判讀</div><div class="data-readout__summary">${esc(dataReadoutSummary(source))}</div></div>`;
  order.forEach(group => {
    const items = grouped.get(group);
    if (!items?.length) return;
    html += `<section class="data-readout__group"><div class="data-readout__group-title">${esc(group)}</div><div class="data-readout__grid">${items.map(renderDataReadoutItem).join('')}</div></section>`;
  });
  html += '</div>';
  return html;
}

function cleanBattlefieldCell(value) {
  return String(value || '')
    .replace(/\*{1,3}/g, '')
    .replace(/`+/g, '')
    .replace(/^\[|\]$/g, '')
    .replace(/(\d+)mm\b/g, '$1m')
    .trim();
}

function parseBattlefieldTable(tableText) {
  const lines = String(tableText || '').trim().split('\n').filter(line => line.trim().startsWith('|'));
  if (lines.length < 2) return null;
  const parseLine = line => line.split('|').slice(1, -1).map(cleanBattlefieldCell);
  const header = parseLine(lines[0]);
  const start = /^\|[-:\s|]+\|$/.test(lines[1].trim()) ? 2 : 1;
  return {
    headers: header,
    rows: lines.slice(start).map(parseLine).filter(row => row.some(Boolean)),
  };
}

function sanitizeBattlefieldOverviewText(text) {
  const sourceLines = String(text || '').split('\n');
  const withoutAutoSummary = [];
  let skippingAutoSummary = false;
  sourceLines.forEach(line => {
    const clean = cleanBattlefieldCell(line).replace(/^#+\s*/, '');
    if (/^📍\s*Auto\s*走位與檔位摘要（不含節奏預測）\s*[:：]?$/.test(clean)) {
      skippingAutoSummary = true;
      return;
    }
    if (skippingAutoSummary && /^📊\s*全場綜合戰力排名/.test(clean)) {
      skippingAutoSummary = false;
      withoutAutoSummary.push(line);
      return;
    }
    if (!skippingAutoSummary) withoutAutoSummary.push(line);
  });

  const unwantedHeaders = new Set(['資料完整度', '風險分', '情境標記']);
  const output = [];
  for (let i = 0; i < withoutAutoSummary.length;) {
    if (!withoutAutoSummary[i].trim().startsWith('|')) {
      output.push(withoutAutoSummary[i]);
      i += 1;
      continue;
    }
    const tableLines = [];
    while (i < withoutAutoSummary.length && withoutAutoSummary[i].trim().startsWith('|')) {
      tableLines.push(withoutAutoSummary[i]);
      i += 1;
    }
    const parsed = parseBattlefieldTable(tableLines.join('\n'));
    if (!parsed) {
      output.push(...tableLines);
      continue;
    }
    const keepIndexes = parsed.headers
      .map((header, index) => unwantedHeaders.has(cleanBattlefieldCell(header)) ? -1 : index)
      .filter(index => index >= 0);
    if (keepIndexes.length === parsed.headers.length) {
      output.push(...tableLines);
      continue;
    }
    output.push(`| ${keepIndexes.map(index => parsed.headers[index]).join(' | ')} |`);
    output.push(`| ${keepIndexes.map(() => '---').join(' | ')} |`);
    parsed.rows.forEach(row => {
      output.push(`| ${keepIndexes.map(index => row[index] || '').join(' | ')} |`);
    });
  }
  return output.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function parseBattlefieldOverview(text) {
  const sanitized = sanitizeBattlefieldOverviewText(text);
  const tablePattern = /(?:^\s*\|.*\|\s*$\n?){2,}/gm;
  const tables = [...sanitized.matchAll(tablePattern)].map(match => ({
    raw: match[0],
    parsed: parseBattlefieldTable(match[0]),
  }));
  const factsTable = tables.find(table => table.parsed?.headers.includes('項目') && table.parsed?.headers.includes('內容'));
  const rankingTable = tables.find(table => table.parsed?.headers.includes('排名') && table.parsed?.headers.includes('馬號'));
  let notes = sanitized;
  tables.forEach(table => { notes = notes.replace(table.raw, '\n'); });
  notes = notes
    .replace(/^\s*(?:#{1,6}\s*)?(?:\[第一部分\]\s*)?(?:🗺️\s*)?戰場全景.*$/gmi, '')
    .replace(/^\s*\*{0,2}📊\s*全場綜合戰力排名\*{0,2}\s*$/gmi, '')
    .replace(/^\s*---+\s*$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
  return {
    facts: factsTable?.parsed?.rows.map(row => ({ label: row[0], value: row[1] })) || [],
    ranking: rankingTable?.parsed || null,
    notes,
  };
}

function splitBattlefieldRacePattern(value) {
  const parts = cleanBattlefieldCell(value).split('/').map(part => part.trim()).filter(Boolean);
  return parts.map((part, index) => {
    if (index === 0) return { label: /^Race\s*\d+/i.test(part) ? '場次' : '班次', value: part };
    if (index === 1 && /\d+\s*m\b/i.test(part)) return { label: '路程', value: part };
    if (/^HKJC$/i.test(part)) return { label: '賽區', value: '香港' };
    if (/^(?:AU|Australia)$/i.test(part)) return { label: '賽區', value: '澳洲' };
    return { label: '賽事條件', value: part };
  });
}

function renderBattlefieldOverview(text, horses = []) {
  const overview = parseBattlefieldOverview(text);
  const racePattern = splitBattlefieldRacePattern(overview.facts.find(fact => cleanBattlefieldCell(fact.label) === '賽事格局')?.value || '');
  const horseLookup = new Map(horses.map(horse => [String(horse.horse_number), horse]));
  let html = '<div class="battlefield battlefield--refined">';
  html += '<div class="battlefield__header"><div><div class="battlefield__eyebrow">賽事快照</div><div class="battlefield__title">🗺️ 戰場全景</div></div><span class="battlefield__header-note">賽事格局 · 綜合戰力</span></div>';
  html += '<div class="battlefield__body">';
  if (racePattern.length) {
    html += `<section class="battlefield__race-pattern" aria-label="賽事格局">${racePattern.map((item, index) => `<div class="battlefield__race-segment"><span>${esc(item.label)}</span><strong>${esc(item.value)}</strong>${index < racePattern.length - 1 ? '<i aria-hidden="true"></i>' : ''}</div>`).join('')}</section>`;
  }
  if (overview.notes) html += `<div class="battlefield__notes battlefield__notes--refined">${formatRichSection(overview.notes)}</div>`;
  if (overview.ranking?.rows?.length) {
    html += `<div class="battlefield-ranking"><div class="battlefield-ranking__header"><div><span>📊</span><strong>全場綜合戰力排名</strong></div><span>${overview.ranking.rows.length} 匹馬</span></div>`;
    // Mobile keeps only the five columns that answer "who is rated where".
    // Everything else (AU: 資料/定位, HKJC: 信心分/風險分/情境標記) is marked
    // optional and hidden under 768px, so the table fits the screen instead of
    // scrolling sideways. Driven by header NAME, because AU and HKJC print
    // different extra columns.
    const RANKING_CORE = ['排名', '馬號', '馬名', '綜合戰力分', 'Grade'];
    const optionalCell = header => RANKING_CORE.some(c => c.toLowerCase() === String(header).toLowerCase())
      ? '' : ' class="battlefield-ranking__cell--optional"';
    html += `<div class="battlefield-ranking__scroll"><table class="battlefield-ranking__table"><thead><tr>${overview.ranking.headers.map(header => `<th${optionalCell(header)}>${esc(header)}</th>`).join('')}</tr></thead><tbody>`;
    overview.ranking.rows.forEach((row, index) => {
      const numberIndex = overview.ranking.headers.indexOf('馬號');
      const horse = horseLookup.get(String(row[numberIndex] || ''));
      html += `<tr class="${index < 3 ? 'battlefield-ranking__row--top' : ''}">`;
      overview.ranking.headers.forEach((header, cellIndex) => {
        const value = row[cellIndex] || '';
        if (header === '排名') {
          const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : esc(value || String(index + 1));
          html += `<td${optionalCell(header)}><span class="battlefield-ranking__rank">${medal}</span></td>`;
        } else if (header === '馬號') {
          html += `<td${optionalCell(header)}><span class="battlefield-ranking__horse-number">${esc(value)}</span></td>`;
        } else if (header === '馬名') {
          html += `<td${optionalCell(header)}><div class="battlefield-ranking__runner">${renderSilk(horse || {}, 'sm')}<div><strong class="battlefield-ranking__horse-name">${esc(value)}</strong>${horse?.horse_name_en ? `<span>${esc(horse.horse_name_en)}</span>` : ''}</div></div></td>`;
        } else if (header === '綜合戰力分') {
          const numericScore = Math.max(0, Math.min(100, Number(value) || 0));
          html += `<td${optionalCell(header)}><div class="battlefield-ranking__score"><strong>${esc(value)}</strong><span aria-hidden="true"><i style="width:${numericScore}%"></i></span></div></td>`;
        } else if (/^Grade$/i.test(header)) {
          html += `<td${optionalCell(header)}>${ratingBadge(value)}</td>`;
        } else {
          html += `<td${optionalCell(header)}>${esc(value || '—')}</td>`;
        }
      });
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  }
  html += '</div></div>';
  return html;
}

// ═══════════════════════════════════════════════
// 完整分析 — structural split
//
// The old builder classified raw_text LINE BY LINE against loose patterns
// (any line containing 風險 opened a 風險分析 chapter, and so on). Measured on
// one AU horse: 核心分析 swallowed 5,244 of 8,048 characters because no later
// pattern matched, the block's own `### 【No.1】…` header leaked in as a
// chapter called 分析摘要, and chapters came out in priority order rather than
// document order.
//
// The source does not need guessing: every horse block on BOTH platforms
// carries a real markdown heading tree (#### sections, ##### subsections) --
// 477/477 AU horses and 131/131 HKJC horses measured 2026-09-02. Split on that.
// ═══════════════════════════════════════════════

// Already shown on the preview card; repeating them is what made 完整分析 long.
// 數據判讀 restates the ranking strip, 近績解構 is the 近六場 line already in the
// card header, and 核心分析 is the dimensions plus the 加分位/扣分位 chips written
// out as a paragraph. All three were collapsed first and then removed outright
// (2026-09-02) -- a collapsed chapter that nobody opens is still a row to scroll
// past. The breakdown and the form file are what the document is for.
const ANALYSIS_SKIP_HEADING = /^(?:🔢\s*)?評分總覽|^主要優勢$|^主要風險$|^數據判讀$|^近績解構$|^核心分析$/;

const ANALYSIS_ICONS = [
  [/數據判讀/, '📊', 'blue'],
  [/近績解構/, '⏱️', 'slate'],
  [/完整賽績檔案|賽績檔案/, '📋', 'slate'],
  [/核心分析/, '🧠', 'blue'],
  [/排名矩陣|評分矩陣|評級矩陣|數值拆解/, '🧮', 'blue'],
  [/結論|評語/, '💡', 'emerald'],
  [/風險/, '⚠️', 'rose'],
  [/晨操|Trackwork/i, '🏇', 'amber'],
  [/Facts/i, '📋', 'slate'],
  [/賽績線/, '🔗', 'slate'],
  [/段速|速度/, '🔬', 'blue'],
];

// Headings arrive with their own emoji ("#### 📊 數據判讀"). Rendering the
// mapped icon as well produced "📊📊 數據判讀", so the leading emoji is lifted
// out of the title and used AS the icon; the map is the fallback for headings
// that carry none (HKJC's "12 項分數", AU's dimension subsections).
// 2300-23FF matters: ⏱️ (U+23F1) opens 近績解構 on both platforms and was
// outside the first range, so that one heading still rendered "⏱️ ⏱️ 近績解構".
const LEADING_EMOJI_RE = /^([\u{1F000}-\u{1FAFF}\u{2300}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]+)\s*/u;

function analysisHeadingStyle(title, isSubsection) {
  const emoji = LEADING_EMOJI_RE.exec(title);
  let theme = 'slate';
  for (const [pattern, , mappedTheme] of ANALYSIS_ICONS) {
    if (pattern.test(title)) { theme = mappedTheme; break; }
  }
  if (emoji) return { icon: emoji[1], theme, title: title.replace(LEADING_EMOJI_RE, '').trim() };
  // Dimension subsections already carry their own verdict symbol in the text
  // ("狀態與穩定性：72.4 分　✅ 偏強"); adding a guessed icon beside it was
  // noise, and the 📄 fallback said nothing at all.
  if (isSubsection) return { icon: '', theme, title };
  for (const [pattern, icon, mappedTheme] of ANALYSIS_ICONS) {
    if (pattern.test(title)) return { icon, theme: mappedTheme, title };
  }
  return { icon: '', theme: 'slate', title };
}

function splitAnalysisByHeadings(raw) {
  const lines = String(raw || '').split('\n');
  const sections = [];
  let section = null, child = null;

  const push = line => {
    if (child) child.content.push(line);
    else if (section) section.content.push(line);
  };

  for (const line of lines) {
    const m = /^(#{3,6})\s+(.+?)\s*$/.exec(line);
    if (!m) { push(line); continue; }
    const depth = m[1].length;
    const title = m[2].replace(/\*+/g, '').trim();
    if (depth <= 3) {
      // The horse's own `### 【No.1】 name | jockey | …` header. Everything
      // about it is already in the card header, and it used to surface as a
      // bogus chapter of its own.
      section = null; child = null;
      continue;
    }
    if (depth === 4) {
      child = null;
      // Headings arrive as "📊 數據判讀"; the skip patterns are anchored to the
      // bare name, so strip the emoji BEFORE testing or nothing ever matches.
      const bareTitle = title.replace(LEADING_EMOJI_RE, '').trim();
      if (ANALYSIS_SKIP_HEADING.test(bareTitle)) { section = null; continue; }
      section = { content: [], children: [], title, ...analysisHeadingStyle(title) };
      sections.push(section);
      continue;
    }
    // depth >= 5 — a subsection of the current section.
    if (!section) continue;
    child = { content: [], title, ...analysisHeadingStyle(title, true) };
    section.children.push(child);
  }

  const tidy = node => { node.content = node.content.join('\n').trim(); return node; };
  const built = sections
    .map(sec => { tidy(sec); sec.children.forEach(tidy); return sec; })
    .filter(sec => sec.content || sec.children.length);

  // The dimension breakdown is what the document is for -- it is the only part
  // that explains the ranking -- so it leads. The form file is the other thing
  // read on its own terms. The rest (數據判讀 restates the strip, 近績解構 is the
  // 近六場 line already on the card, 核心分析 re-states the dimensions and the
  // 加分位/扣分位 chips in prose) stay reachable but start collapsed, which is
  // what stops the document running long. Matched by pattern so HKJC's
  // differently-named chapters (評分矩陣 (7D 數值拆解), Facts 摘錄) sort too.
  const rank = sec => (/矩陣|拆解/.test(sec.title) ? 0 : /賽績檔案|Facts/.test(sec.title) ? 1 : 2);
  built.forEach(sec => { if (rank(sec) === 2) sec.collapsed = true; });
  return built
    .map((sec, index) => ({ sec, index }))
    .sort((a, b) => rank(a.sec) - rank(b.sec) || a.index - b.index)
    .map(x => x.sec);
}

function buildHorseAnalysisSections(horse) {
  // Preferred path: split on the document's own headings.
  if (horse.raw_text && /^#{4}\s+/m.test(horse.raw_text)) {
    const structured = splitAnalysisByHeadings(horse.raw_text)
      .filter(sec => sec.children.length || !isEmptySection(sec.content));
    if (structured.length) {
      const rows = Array.isArray(horse.data_readout) ? horse.data_readout.filter(Boolean) : [];
      structured.forEach(sec => { if (/數據判讀/.test(sec.title)) sec.rows = rows; });
      return structured;
    }
  }
  // Fallback for older archived meetings written without a heading tree.
  let sections;
  if (horse.raw_text) {
    sections = parseRawTextSections(horse.raw_text).filter(section => !isEmptySection(section.content));
  } else {
    sections = [
      { icon:'🔬', title:'段速法醫', color:'#2563EB', bg:'#EFF6FF', content:horse.speed_forensics },
      { icon:'⚡', title:'EEM 能量引擎', color:'#D97706', bg:'#FFFBEB', content:horse.eem_energy },
      { icon:'📋', title:'寬恕檔案', color:'#0F766E', bg:'#F0FDFA', content:horse.forgiveness_file },
      { icon:'🔗', title:'賽績線', color:'#475569', bg:'#F8FAFC', content:horse.form_line },
      { icon:'🐴', title:'馬匹剖析', color:'#475569', bg:'#F8FAFC', content:horse.horse_profile },
      { icon:'🧠', title:'核心分析', color:'#1E40AF', bg:'#EFF6FF', content:horse.core_analysis },
      { icon:'💡', title:'結論', color:'#059669', bg:'#ECFDF5', content:horse.conclusion },
    ].filter(section => section.content && !isEmptySection(section.content));
  }
  // The 數據判讀 chapter used to be dropped here because the preview card
  // rendered the rows itself. The card no longer does, so dropping it would
  // make the readout vanish completely on the fallback path (older archived
  // meetings). Keep the chapter and hand it the structured rows instead.
  const readoutRows = Array.isArray(horse.data_readout) ? horse.data_readout.filter(Boolean) : [];
  const merged = [];
  const mergedByTitle = new Map();
  sections.forEach((section, index) => {
    const titleKey = String(section.title || '分析').replace(/\s+/g, '').toLowerCase();
    const content = String(section.content || '').trim();
    const existing = mergedByTitle.get(titleKey);
    if (!existing) {
      const item = { ...section, content, sourceIndex: index };
      merged.push(item);
      mergedByTitle.set(titleKey, item);
      return;
    }
    if (content && !existing.content.includes(content)) existing.content += `\n\n${content}`;
  });
  const priority = { '結論': 0, '風險分析': 1, '核心分析': 2, '段速法醫': 3 };
  const ordered = merged
    .sort((a, b) => (priority[a.title] ?? 20) - (priority[b.title] ?? 20) || a.sourceIndex - b.sourceIndex);
  if (readoutRows.length) {
    const existing = ordered.find(section => section.title === '數據判讀');
    if (existing) existing.rows = readoutRows;
    else ordered.push({ icon: '📊', title: '數據判讀', color: '#2563EB', bg: '#EFF6FF', content: '', rows: readoutRows });
  }
  return ordered;
}

function analysisSectionTheme(section) {
  if (section.title === '風險分析' || section.color === '#DC2626') return 'rose';
  if (section.title === '結論' || section.color === '#059669' || section.color === '#0F766E') return 'emerald';
  if (section.color === '#D97706') return 'amber';
  if (section.color === '#2563EB' || section.color === '#1E40AF') return 'blue';
  return 'slate';
}

// AU writes its form file as pipe-delimited records, one per bullet, with a
// legend row in the SAME shape as the data ("- `正式` 日期 | 場地 | 路程 | …").
// Rendered as bullets that legend read as a phantom first start, and the
// records themselves wrapped into an unscannable paragraph. As a table the
// columns line up and the legend becomes the header it already was.
//
// HKJC's equivalent sections are `- **label:** value` pairs, a different shape
// entirely, so this returns null unless the records actually parse -- and the
// caller falls back to normal rendering.
const FORM_RECORD_RE = /^[-*]\s*`([^`]+)`\s*(.+)$/;
const FORM_FIELD_PREFIX = /^(?:場地|檔位|名次|走勢)\s+/;

function parseFormRecords(content) {
  const rows = [];
  for (const line of String(content || '').split('\n')) {
    const m = FORM_RECORD_RE.exec(line.trim());
    if (!m) continue;
    const cells = m[2].split('|').map(c => c.trim().replace(FORM_FIELD_PREFIX, ''));
    if (cells.length < 5) continue;
    rows.push({ tag: m[1].trim(), cells });
  }
  if (rows.length < 2) return null;
  // The legend row is the one whose date column is not a date.
  const isLegend = row => !/\d{4}-\d{2}-\d{2}|\d{1,2}\/\d{1,2}/.test(row.cells[0]);
  const body = rows.filter(r => !isLegend(r));
  if (!body.length) return null;
  return body;
}

const FORM_HEADERS = ['類別', '日期', '賽事', '路程', '地況', '檔位', '名次', '走勢'];
// Phone keeps date / race / finish / running line -- what the record is read
// for. 路程 and 檔位 stay on desktop.
const FORM_OPTIONAL = new Set(['路程', '檔位']);

function renderFormRecords(rows) {
  let h = '<div class="form-records"><table class="form-records__table"><thead><tr>';
  FORM_HEADERS.forEach(header => {
    h += `<th${FORM_OPTIONAL.has(header) ? ' class="form-records__cell--optional"' : ''}>${esc(header)}</th>`;
  });
  h += '</tr></thead><tbody>';
  rows.forEach(row => {
    const cells = [row.tag, ...row.cells];
    h += '<tr>';
    FORM_HEADERS.forEach((header, i) => {
      const optional = FORM_OPTIONAL.has(header) ? ' class="form-records__cell--optional"' : '';
      const value = cells[i] == null ? '' : cells[i];
      // data-label drives the phone layout, where the table collapses into one
      // block per start and the header row is gone.
      const label = ` data-label="${header}"`;
      if (header === '類別') h += `<td${optional}${label}><span class="form-records__tag">${esc(value)}</span></td>`;
      else h += `<td${optional}${label}>${esc(value) || '—'}</td>`;
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

function renderAnalysisDocumentSection(section, index, cardId) {
  const theme = section.theme || analysisSectionTheme(section);
  const chapter = String(index + 1).padStart(2, '0');
  const sectionId = `${cardId}-chapter-${index + 1}`;

  let body = '';
  // 數據判讀 has a purpose-built grid renderer; it was previously dumped as
  // plain text here AND shown on the card. It now appears once, here -- and
  // collapsed, because its first group (綜合戰力分 / 主要支柱 / 最弱環節 /
  // 數據信心) restates the ranking strip line for line, so opening the
  // document with it expanded reads as the same paragraph twice.
  const isReadout = /數據判讀/.test(section.title);
  if (section.collapsed && !isReadout && section.content) {
    const bodyId = `${sectionId}-body`;
    body += `<div class="analysis-sub">
      <button type="button" class="analysis-sub__toggle" aria-expanded="false" aria-controls="${bodyId}" onclick="toggleAnalysisSub('${bodyId}', this)">
        <span class="analysis-sub__title">展開${esc(section.title)}</span>
        <span class="analysis-sub__chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="${bodyId}" class="analysis-sub__body" hidden>${formatRichSection(section.content)}</div>
    </div>`;
  } else if (isReadout && Array.isArray(section.rows) && section.rows.length) {
    const readoutId = `${sectionId}-readout`;
    body += `<div class="analysis-sub">
      <button type="button" class="analysis-sub__toggle" aria-expanded="false" aria-controls="${readoutId}" onclick="toggleAnalysisSub('${readoutId}', this)">
        <span class="analysis-sub__title">展開數據判讀</span>
        <span class="analysis-sub__chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="${readoutId}" class="analysis-sub__body" hidden>${renderDataReadout(section.rows)}</div>
    </div>`;
  } else if (section.content) {
    const records = parseFormRecords(section.content);
    body += records ? renderFormRecords(records) : formatRichSection(section.content);
  }

  // Subsections (the seven per-dimension breakdowns) collapse individually.
  // Left expanded they were the bulk of the document and made the phone view
  // an endless scroll.
  (section.children || []).forEach((child, childIndex) => {
    const childId = `${sectionId}-sub-${childIndex + 1}`;
    body += `<div class="analysis-sub" id="${childId}-anchor">
      <button type="button" class="analysis-sub__toggle" aria-expanded="false" aria-controls="${childId}" onclick="toggleAnalysisSub('${childId}', this)">
        ${child.icon ? `<span class="analysis-sub__icon" aria-hidden="true">${child.icon}</span>` : ''}
        <span class="analysis-sub__title">${esc(child.title)}</span>
        <span class="analysis-sub__chevron" aria-hidden="true">⌄</span>
      </button>
      <div id="${childId}" class="analysis-sub__body" hidden>${renderDimensionBody(child.content)}</div>
    </div>`;
  });

  return `<section id="${sectionId}" class="analysis-document__section analysis-document__section--${theme}">
    <div class="analysis-document__section-title"><span class="analysis-document__chapter">${chapter}</span>${section.icon ? `<span aria-hidden="true">${section.icon}</span>` : ''}<span class="analysis-document__section-name">${esc(section.title)}</span>${(section.children || []).length ? `<span class="analysis-document__section-count">${section.children.length} 項</span>` : ''}</div>
    <div class="analysis-document__section-body">${body}</div>
  </section>`;
}

function toggleAnalysisSub(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  const open = !el.hidden;
  el.hidden = open;
  btn.setAttribute('aria-expanded', String(!open));
  btn.classList.toggle('is-open', !open);
  // The parent 完整分析 panel is height-animated; once a subsection changes
  // height its max-height has to be released or the new content is clipped.
  const panel = btn.closest('.expand-animate');
  if (panel && !panel.classList.contains('expand-animate--collapsed')) panel.style.maxHeight = 'none';
}

// ═══════════════════════════════════════════════
// Ranking matrix + market comparison
//
// Both read fields the engine has always written and the payload started
// carrying on 2026-09-02 (dimension_details, market_win_odds). Nothing here
// computes a score or reorders anything -- the model's rank is the model's.
// ═══════════════════════════════════════════════

// 加分位 / 扣分位 — the generator's own bullets, shortened.
//
// The source writes full sentences ("Chris Waller 呢邊嘅部署訊號偏正面，人馬配搭
// 有基本支持"), which read as padding on a card that already shows the trainer.
// Measured across 477 horses on 2026-09-02: 560 risk bullets use just 8
// phrasings and the advantage bullets use 9 templates (the trainer one embeds a
// name, which is why it counts as 55 distinct strings). So this is a lookup,
// not summarisation -- and an unrecognised phrasing falls through to the
// original sentence rather than disappearing.
// tests/test_parser_au_structured.py asserts the map still covers the corpus.
const VERDICT_SHORTHAND = [
  // 優勢
  [/場地或場館適性有實際證據/, '場地適性有實績'],
  [/對手後續升班仲交到貨/, '賽績線受驗證'],
  [/近期交代密度夠/, '近況穩定'],
  [/整體結構平均/, '結構平均 · 冇明顯弱項'],
  [/往績速度考驗背景唔差/, '速度背景唔差'],
  [/班次同負磅未見吃力/, '班次負磅唔吃力'],
  [/檔位同場面節奏形勢配腳/, '檔位／節奏配腳'],
  [/初出前備戰唔差/, '試閘交代清晰'],
  [/^(.+?)\s*呢邊嘅部署訊號偏正面/, m => `練馬師 ${m[1].trim()}`],
  // 風險
  [/主要變數仍然係臨場節奏同對手反應/, '安全邊際一般'],
  [/班次或負磅面前仍有壓力/, '班次／負磅有壓力'],
  [/頂磅環境下要自己讓人/, '頂磅讓人'],
  [/近況同穩定性都唔靚/, '近績差'],
  [/段速實證偏弱/, '段速偏弱'],
  [/初出馬正式實戰樣本仍然空白/, '初出馬 · 冇實戰樣本'],
  [/場面節奏配腳未算理想/, '節奏配腳一般'],
  [/場地適性仍未有清楚支持/, '場地適性未有支持'],
];

function shortenVerdict(line) {
  const text = String(line || '').trim();
  if (!text) return '';
  for (const [pattern, replacement] of VERDICT_SHORTHAND) {
    const m = pattern.exec(text);
    if (m) return typeof replacement === 'function' ? replacement(m) : replacement;
  }
  return text;   // unknown phrasing: show it whole rather than dropping it
}

function renderVerdictChips(horse) {
  const split = value => String(value || '').split('\n').map(x => x.trim()).filter(Boolean);
  const plus = split(cleanText(horse.advantage)).map(shortenVerdict);
  const minus = split(cleanText(horse.risk)).map(shortenVerdict);

  // The jockey/trainer names are facts; whether they count as a plus is the
  // engine's call, taken from the 騎練訊號 dimension's own impact rather than
  // asserted here.
  const jt = (horse.dimension_details || []).find(d => /騎練/.test(d.name));
  if (jt && jt.score != null && jt.weight_pct != null) {
    const impact = (jt.score - 60) * jt.weight_pct / 100;
    const people = [horse.jockey && `騎師 ${horse.jockey}`, horse.trainer && `練馬師 ${horse.trainer}`].filter(Boolean);
    const target = impact >= 0 ? plus : minus;
    people.forEach(p => {
      // the trainer may already be there via the 部署訊號 template
      if (!target.some(x => horse.trainer && x.includes(horse.trainer) && p.includes(horse.trainer))) target.push(p);
    });
  }

  if (!plus.length && !minus.length) return '';
  const group = (label, cls, items) => items.length
    ? `<div class="verdict verdict--${cls}"><span class="verdict__label">${label}</span><span class="verdict__items">${
        items.map(i => `<span class="verdict__chip">${esc(i)}</span>`).join('')}</span></div>`
    : '';
  return `<div class="verdicts">${group('✅ 加分位', 'plus', plus)}${group('⚠️ 扣分位', 'minus', minus)}</div>`;
}

const DIM_SYMBOL_COLOR = {
  '✅✅': '#047857', '✅': '#059669', '➖': '#94A3B8', '❌': '#DC2626', '❌❌': '#991B1B',
};

function dimEvidenceLabel(detail) {
  // Show the deepest single line of evidence behind the dimension. Absence is
  // rendered as nothing at all rather than "0" -- 檔位形勢 is qualitative
  // (跑法/賽道幾何) and has no sample size to report, which is not the same
  // claim as "this judgement rests on no evidence".
  const counts = detail.sample_counts || [];
  if (!counts.length) return '';
  let best = '', bestN = -1;
  counts.forEach(token => {
    const n = parseInt(token, 10);
    if (Number.isFinite(n) && n > bestN) { bestN = n; best = token; }
  });
  return best;
}

function renderDimensionStrip(horse) {
  const details = horse.dimension_details || [];
  if (!details.length) return '';
  const ranked = details.filter(d => d.ranking_weighted && d.weight_pct != null);
  const reference = details.filter(d => !d.ranking_weighted);
  if (!ranked.length) return '';

  // Bar length used to be the ranking weight -- which is a property of the
  // MODEL, not of this horse: measured across 477 horses on 2026-09-02 the
  // between-horse SD of every dimension's weight is exactly 0.00, so every
  // card drew an identical bar pattern and carried no information at all.
  //
  // What differs per horse is how far the dimension sat from neutral, times
  // its weight -- i.e. how much this dimension actually moved THIS horse
  // relative to a neutral one. Between-horse SD 4.30 / 3.55 / 2.03 / 1.49 /
  // 0.87 by dimension. `contribution` carries the same variance but sits on a
  // large constant pedestal (場地與地況適性 never leaves 3.76-8.50), which
  // flattens the differences; subtracting neutral puts them back on screen and
  // adds a sign.
  const NEUTRAL_SCORE = 60;   // the engine's 統一尺: "60 為中性"
  const IMPACT_SCALE = 11;    // ~max |impact| observed; bars clip beyond it
  const impactOf = d => (d.score - NEUTRAL_SCORE) * d.weight_pct / 100;

  let h = '<div class="dim-strip">';

  h += '<div class="dim-strip__head"><span class="dim-strip__title">六維排名矩陣<span class="dim-strip__title-hint"> · 條長 = 對呢匹馬嘅實際影響</span></span>';
  if (horse.evidence_dimensions != null && horse.evidence_dimensions_total) {
    const thin = horse.evidence_dimensions < horse.evidence_dimensions_total;
    h += `<span class="dim-strip__evidence${thin ? ' dim-strip__evidence--thin' : ''}">${thin ? '⚠️ ' : ''}${horse.evidence_dimensions}/${horse.evidence_dimensions_total} 維有實測</span>`;
  }
  h += '</div>';

  // Row order stays weight-descending for every horse so the rows can be
  // compared down a column of cards; the bars carry the per-horse story.
  const ordered = [...ranked].sort((a, b) => b.weight_pct - a.weight_pct);
  ordered.forEach(d => {
    const impact = impactOf(d);
    const colour = impact >= 0 ? '#059669' : '#DC2626';
    const half = Math.min(Math.abs(impact) / IMPACT_SCALE, 1) * 50;
    const side = impact >= 0 ? `left:50%;width:${half}%` : `right:50%;width:${half}%`;
    const evidence = dimEvidenceLabel(d);
    h += '<div class="dim-row">';
    h += `<span class="dim-row__name" title="${esc(d.name)}">${esc(d.name)}</span>`;
    h += `<span class="dim-row__score" style="color:${DIM_SYMBOL_COLOR[d.symbol] || '#475569'}">${d.score != null ? d.score.toFixed(1) : '—'}</span>`;
    h += `<span class="dim-row__track" title="${esc(d.name)} 對排名嘅影響 ${impact >= 0 ? '+' : ''}${impact.toFixed(1)} 分（${d.score.toFixed(1)} 分 vs 中性 60，乘 ${d.weight_pct.toFixed(1)}% 權重）"><span class="dim-row__fill" style="${side};background:${colour}"></span></span>`;
    h += `<span class="dim-row__meta">${impact >= 0 ? '+' : ''}<b>${impact.toFixed(1)}</b> · ${d.weight_pct.toFixed(1)}%${evidence ? ' · ' + esc(evidence) : ''}</span>`;
    h += '</div>';
  });

  // One line answering "what is actually driving this horse" -- the question
  // the constant-weight bars could never answer.
  const byImpact = [...ordered].sort((a, b) => impactOf(b) - impactOf(a));
  const best = byImpact[0], worst = byImpact[byImpact.length - 1];
  const drivers = [];
  if (best && impactOf(best) > 0.5) drivers.push(`<span class="up">▲ 主要推力 <b>${esc(best.name)} +${impactOf(best).toFixed(1)}</b></span>`);
  if (worst && impactOf(worst) < -0.5) drivers.push(`<span class="down">▼ 主要拖累 <b>${esc(worst.name)} ${impactOf(worst).toFixed(1)}</b></span>`);
  if (!drivers.length) drivers.push('<span>六維都接近中性，冇單一維度主導</span>');
  h += `<div class="dim-strip__driver">${drivers.join('')}</div>`;

  if (reference.length) {
    // Printed by the engine, explicitly 參考·不入排名. Shown rather than hidden:
    // the dashboard used to display 5 of the 7 dimensions in the file with
    // nothing saying the other two existed.
    h += '<div class="dim-ref">參考 · 不入排名：' + reference.map(d =>
      // nowrap per item, else the trailing ✅ drops to a line of its own
      `<span class="dim-ref__item"><b>${esc(d.name)}</b> ${d.score != null ? d.score.toFixed(1) : '—'} ${d.symbol || ''}</span>`
    ).join('　·　') + '</div>';
  }
  return h + '</div>';
}

function marketRankMap(fieldHorses) {
  // Rank by win odds, shortest first. Scratched/unpriced runners are left out
  // rather than sorted to the end, where they would push every real runner's
  // market rank down.
  const priced = (fieldHorses || [])
    .filter(h => typeof h.market_win_odds === 'number' && h.market_win_odds > 0)
    .sort((a, b) => a.market_win_odds - b.market_win_odds);
  const map = new Map();
  priced.forEach((h, i) => map.set(h.horse_number, i + 1));
  return map;
}

function renderMarketLine(horse, marketRanks) {
  const win = horse.market_win_odds;
  const place = horse.market_place_odds;
  if (win == null && place == null) return '';

  let h = '<div class="mkt">';
  const bits = [];
  if (win != null) bits.push(`贏 $${win.toFixed(2)}`);
  if (place != null) bits.push(`位 $${place.toFixed(2)}`);
  h += `<span class="mkt__odds">💰 ${bits.join(' / ')}</span>`;

  const mRank = marketRanks ? marketRanks.get(horse.horse_number) : null;
  const modelRank = horse.rank;
  if (mRank && modelRank) {
    h += `<span class="mkt__ranks">模型第 ${modelRank} · 市場第 ${mRank}</span>`;
    const gap = mRank - modelRank;   // positive: we rate it higher than the market
    // Green is reserved for actual agreement. A 1-2 place difference painted
    // green while reading "差 2 位" says two different things at once.
    // The ±3 cut is a display threshold, not a measured one -- it decides what
    // gets highlighted, never what gets scored.
    let cls, label;
    if (gap >= 3) { cls = 'over'; label = `我哋高市場 ${gap} 位`; }
    else if (gap <= -3) { cls = 'under'; label = `市場高我哋 ${-gap} 位`; }
    else if (gap === 0) { cls = 'agree'; label = '同市場一致'; }
    else { cls = 'near'; label = `差 ${Math.abs(gap)} 位`; }
    h += `<span class="mkt__gap mkt__gap--${cls}">${label}</span>`;
  } else if (mRank) {
    h += `<span class="mkt__ranks">市場第 ${mRank}</span>`;
  }
  return h + '</div>';
}

// ═══════════════════════════════════════════════
// 完整分析 — lazy loaded per meeting
//
// raw_text was 6.79 MiB of a 9.62 MiB snapshot (70.5%), inlined into the HTML
// so that every visitor downloaded six meetings of full analysis text in order
// to read one race. It is only needed when a card is expanded, so it now lives
// in analysis/<meeting-slug>.json and is fetched on first expand. The HTML
// went from 9.97 MiB to 3.18 MiB.
// ═══════════════════════════════════════════════

// cardId -> {slug, key, rows}. A Map rather than data-* attributes so the
// 數據判讀 rows travel as objects instead of JSON escaped into markup.
const LAZY_ANALYSIS_CTX = new Map();
const ANALYSIS_BUNDLES = new Map();   // slug -> {"analyst|race|horse": text}
const ANALYSIS_PENDING = new Map();   // slug -> in-flight promise

function analysisRefFor(analyst, raceNumber, horseNumber) {
  // Key must match the one generate_static writes: "analyst|race|horse".
  if (!selectedMeeting || !analyst || raceNumber == null || horseNumber == null) return null;
  return {
    slug: analysisSlug(getMeetingKey(selectedMeeting)),
    key: `${analyst}|${raceNumber}|${horseNumber}`,
  };
}

function analysisSlug(meetingKey) {
  return String(meetingKey || '').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase();
}

async function loadAnalysisBundle(slug) {
  if (!slug) return null;
  if (ANALYSIS_BUNDLES.has(slug)) return ANALYSIS_BUNDLES.get(slug);
  if (ANALYSIS_PENDING.has(slug)) return ANALYSIS_PENDING.get(slug);
  // file:// has no fetch; the double-clickable local copy simply has no
  // 完整分析 rather than failing in a way that looks like missing data.
  if (window.location.protocol === 'file:') return null;
  const promise = fetch(`analysis/${slug}.json`, { cache: 'no-cache' })
    .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
    .then(bundle => { ANALYSIS_BUNDLES.set(slug, bundle); return bundle; })
    .catch(err => { console.warn('analysis bundle failed', slug, err); return null; })
    .finally(() => ANALYSIS_PENDING.delete(slug));
  ANALYSIS_PENDING.set(slug, promise);
  return promise;
}

function renderHorseCard(horse, topPickRank, marketRanks, analysisRef) {
  // With raw_text lifted into a side bundle the sections cannot be built yet;
  // the button is offered on the promise of the bundle and the document is
  // rendered on first expand. Cards that still carry raw_text (older archived
  // snapshots, the local file:// copy) keep rendering eagerly.
  // Gate on whether a lazy bundle is available, NOT on raw_text: a horse with
  // data_readout but no raw_text and no bundle (fixtures, older archived
  // snapshots) still has a 數據判讀 chapter to show, and gating on raw_text
  // dropped it silently.
  const lazyAnalysis = !horse.raw_text && !!(analysisRef && analysisRef.slug && analysisRef.key);
  const analysisSections = lazyAnalysis ? [] : buildHorseAnalysisSections(horse);
  const topicCount = analysisSections.length;
  const hasAnalysis = topicCount > 0 || lazyAnalysis;
  const officialHorseUrl = hkjcHorseProfileUrl(horse);

  html += '<div style="min-width:0;flex:1">';

  if (horse.weight) { const w = esc(horse.weight); html += `<span title="負磅/排位體重"> · ⚖️ 負磅: ${w.includes('磅') ? w : w + '磅'}</span>`; }
  if (horse.barrier) html += `<span> · 檔${horse.barrier}</span>`;
  html += '</div></div></div>';
  if (officialHorseUrl) {
    html += `<a class="horse-card__official-link" href="${esc(officialHorseUrl)}" target="_blank" rel="noopener noreferrer" aria-label="在新分頁開啟${esc(horse.horse_name || '')}官方馬匹資料">官方馬匹資料 <span aria-hidden="true">↗</span></a>`;
  }
  html += '</div>';

  // Body
  html += '<div class="horse-card__body"><div class="horse-card__details">';
  if (horse.situation_tag) html += `<div>📌 ${esc(horse.situation_tag)}</div>`;
  if (horse.recent_form || horse.form_cycle) {

    if (cleanForm) formLine += `近六場: <strong>${esc(cleanForm)}</strong>`;
    if (cleanForm && horse.form_cycle) formLine += ' | ';

    if (cleanForm || horse.form_cycle) html += `<div>${formLine}</div>`;
  }
  html += renderMarketLine(horse, marketRanks);
  html += renderDimensionStrip(horse);
  html += renderVerdictChips(horse);
  // 數據判讀 used to live here. It restated what the ranking matrix now shows
  // -- 主要支柱 / 最弱環節 / 數據信心 are the strip's top bar, bottom bar and
  // evidence badge -- so on the preview card it was the same reading twice.
  // The rows are still in raw_text and reachable from 完整分析.
  // 核心邏輯 removed from the preview card (user request) — 數據判讀 only.
  // Underhorse signal
  if (horse.underhorse_triggered) {

    const cleanCondition = cleanText(horse.underhorse_condition);

    if (cleanCondition) uhHtml += `<br>🎯 <strong>受惠條件:</strong> ${esc(cleanCondition)}`;
    if (cleanReason && cleanReason !== '未觸發' && cleanReason.length > 1) uhHtml += `<br>📝 <strong>理由:</strong> ${esc(cleanReason)}`;
    uhHtml += '</div>';
    html += uhHtml;
  }
  html += '</div>';

  // Expand button — inside body, before expandable section
  if (hasAnalysis) {
    if (lazyAnalysis) {
      LAZY_ANALYSIS_CTX.set(cardId, {
        slug: analysisRef.slug,
        key: analysisRef.key,
        rows: Array.isArray(horse.data_readout) ? horse.data_readout.filter(Boolean) : [],
      });
    }
    const ref = lazyAnalysis ? ' data-analysis-lazy="1"' : '';
    const meta = lazyAnalysis ? '' : `${topicCount} 個章節 `;
    html += `<button type="button" class="horse-card__expand-btn" aria-expanded="false" aria-controls="${cardId}-detail"${ref} onclick="toggleCard('${cardId}', this)">
      <span class="horse-card__expand-label">完整分析</span>

    </button>`;
  }

  // Only the outer control collapses; once opened, every chapter stays visible.
  if (lazyAnalysis) {
    html += `<div id="${cardId}-detail" class="expand-animate expand-animate--collapsed" style="margin-top:0"></div>`;
  } else if (hasAnalysis) {
    html += `<div id="${cardId}-detail" class="expand-animate expand-animate--collapsed" style="margin-top:0">${renderAnalysisDetail(analysisSections, cardId)}</div>`;
  }
  html += '</div>'; // closes horse-card__body
  html += '</div>'; // closes horse-card container
  return html;
}

// A dimension breakdown is not free prose -- it has a fixed three-part shape on
// both platforms:
//   - **評分構成:**  the formula, with each sub-score and its derivation nested
//   - **判讀:**      (HKJC: **Python 判讀:**) the verdict in words
//   - **數據:**      (HKJC: **資料錨點:**) labelled facts
// Rendered as bullets it read as a wall of text. Parsed into those parts it
// becomes a formula strip, a callout and a key/value grid. Anything that does
// not match this shape falls through to formatRichSection unchanged.

function parseIndentedBlocks(content) {
  const blocks = [];
  // The section content was `.trim()`ed upstream, which strips the indent of
  // the FIRST line only -- so 評分構成 arrived at indent 0 while 判讀 and 數據
  // sat at 2 and became its children. Re-base every line on the smallest
  // indent present instead of trusting the raw column.
  const lines = String(content || '').split('\n').filter(l => l.trim());
  const indentOf = l => l.length - l.replace(/^\s*/, '').length;
  // Only the FIRST line lost its indent, so its true column is the smallest
  // indent among the lines that kept theirs. Taking a plain minimum over all
  // lines just returns 0 and changes nothing -- which is how 判讀 and 數據
  // stayed nested under 評分構成 after the first attempt at this fix.
  const rest = lines.slice(1).map(indentOf);
  const base = rest.length ? Math.min(...rest) : 0;
  const normalised = lines.map((l, i) => (i === 0 ? ' '.repeat(base) + l.trimStart() : l));
  for (const raw of normalised) {
    if (!raw.trim()) continue;
    const indent = raw.length - raw.replace(/^\s*/, '').length;
    const text = raw.replace(/^\s*[-*]\s*/, '').trim();
    if (!text) continue;
    const labelled = /^\*\*(.+?)[:：]\*\*\s*(.*)$/.exec(text);
    const node = {
      indent,
      label: labelled ? labelled[1].trim() : null,
      text: labelled ? labelled[2].trim() : text,
      children: [],
    };
    // attach to the deepest open node with a smaller indent
    let parent = null;
    for (let i = blocks.length - 1; i >= 0; i--) {
      const candidate = deepestOpen(blocks[i], indent);
      if (candidate) { parent = candidate; break; }
    }
    if (parent) parent.children.push(node); else blocks.push(node);
  }
  return blocks;
}

function deepestOpen(node, indent) {
  if (node.indent >= indent) return null;
  for (let i = node.children.length - 1; i >= 0; i--) {
    const deeper = deepestOpen(node.children[i], indent);
    if (deeper) return deeper;
  }
  return node;
}

function renderKvGrid(nodes) {
  const rows = nodes.map(n => {
    const m = /^(.{1,18}?)\s*[:：]\s*(.+)$/s.exec(n.text);
    return m ? { k: m[1], v: m[2] } : { k: '', v: n.text };
  });
  return `<dl class="dim-kv">${rows.map(r =>
    `<div class="dim-kv__row"><dt>${esc(r.k)}</dt><dd>${esc(r.v)}</dd></div>`).join('')}</dl>`;
}

function renderSubScore(node) {
  // "騎師分 46 ← Jason Whiting 去年官方 570 場…" — the score is the headline,
  // the source is the caption, the nested lines are the arithmetic.
  const m = /^(.+?分)\s*([\d.]+)\s*←\s*(.+)$/s.exec(node.text);
  const name = m ? m[1] : node.text.slice(0, 24);
  const score = m ? m[2] : null;
  const source = m ? m[3] : '';
  const detail = node.children.length
    ? `<div class="dim-sub__detail">${node.children.map(c => `<div>${esc(c.text)}</div>`).join('')}</div>`
    : '';
  return `<div class="dim-sub">
    <div class="dim-sub__head"><span class="dim-sub__name">${esc(name)}</span>${
      score !== null ? `<span class="dim-sub__score">${esc(score)}</span>` : ''}</div>
    ${source ? `<div class="dim-sub__source">${esc(source)}</div>` : ''}
    ${detail}
  </div>`;
}

function renderDimensionBody(content) {
  const blocks = parseIndentedBlocks(content);
  const labelled = blocks.filter(b => b.label);
  if (!labelled.length) return formatRichSection(content);

  let h = '';
  const find = re => blocks.find(b => b.label && re.test(b.label));
  const formula = find(/評分構成/);
  const verdict = find(/判讀/);
  const data = find(/數據|資料錨點/);

  if (formula) {
    h += `<div class="dim-formula"><span class="dim-formula__label">點計出嚟</span><span class="dim-formula__body">${esc(formula.text)}</span></div>`;
    if (formula.children.length) {
      h += `<div class="dim-subs">${formula.children.map(renderSubScore).join('')}</div>`;
    }
  }
  if (verdict && verdict.text) {
    h += `<div class="dim-verdict">${esc(verdict.text)}</div>`;
  }
  if (data) {
    const rows = [data.text ? { indent: 0, text: data.text, children: [] } : null, ...data.children].filter(Boolean);
    if (rows.length) h += renderKvGrid(rows);
  }
  // Anything the three known parts did not claim (HKJC prints extra bare lines).
  const claimed = new Set([formula, verdict, data].filter(Boolean));
  const rest = blocks.filter(b => !claimed.has(b));
  if (rest.length) h += renderKvGrid(rest);
  return h;
}

function renderAnalysisDetail(sections, cardId) {
  // The rail lists chapters AND each dimension inside the breakdown: the
  // dimensions are what the reader actually jumps between, and they were
  // reachable only by scrolling the chapter and hunting for the right toggle.
  const links = sections.map((section, index) => {
    const sectionId = `${cardId}-chapter-${index + 1}`;
    let html = `<a class="analysis-nav__chapter" href="#${sectionId}" onclick="jumpToAnalysis(event, '${sectionId}')">`
      + `<span class="analysis-nav__num">${String(index + 1).padStart(2, '0')}</span>`
      + `<span class="analysis-nav__text">${esc(section.title)}</span></a>`;
    (section.children || []).forEach((child, childIndex) => {
      const childId = `${sectionId}-sub-${childIndex + 1}`;
      // "狀態與穩定性：72.4 分　✅ 偏強" -> name + symbol, dropped the rest
      const name = String(child.title).split(/[:：]/)[0].trim();
      const symbol = (/([✅❌➖]+)/.exec(child.title) || [, ''])[1];
      html += `<a class="analysis-nav__dim" href="#${childId}-anchor" onclick="jumpToAnalysis(event, '${childId}-anchor', true)">`
        + `<span class="analysis-nav__text">${esc(name)}</span>`
        + (symbol ? `<span class="analysis-nav__sym">${symbol}</span>` : '')
        + `</a>`;
    });
    return html;
  }).join('');

  return `<div class="analysis-detail">
        <div class="analysis-detail__header"><div class="analysis-detail__title">完整分析</div><div class="analysis-detail__hint">全部內容已展開 · 可用章節索引快速跳讀</div></div>
        <nav class="analysis-document__nav" aria-label="完整分析章節"><span class="analysis-document__nav-label">章節</span>${links}</nav>
        <div class="analysis-document">${sections.map((section, index) => renderAnalysisDocumentSection(section, index, cardId)).join('')}</div>
      </div>`;
}

function jumpToAnalysis(event, targetId, expand) {
  event.preventDefault();
  const el = document.getElementById(targetId);
  if (!el) return;
  // A dimension link opens the block it points at -- jumping to a collapsed
  // toggle and leaving it shut would look like the link did nothing.
  if (expand) {
    const body = el.querySelector('.analysis-sub__body');
    const toggle = el.querySelector('.analysis-sub__toggle');
    if (body && body.hidden && toggle) toggleAnalysisSub(body.id, toggle);
  }
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.remove('analysis-flash');
  void el.offsetWidth;              // restart the animation on a repeat click
  el.classList.add('analysis-flash');
  const nav = el.closest('.analysis-detail')?.querySelector('.analysis-document__nav');
  if (nav) {
    nav.querySelectorAll('.is-active').forEach(a => a.classList.remove('is-active'));
    nav.querySelector(`a[href="#${targetId}"]`)?.classList.add('is-active');
  }
}

async function fillLazyAnalysis(panel, btn, cardId) {
  const ctx = LAZY_ANALYSIS_CTX.get(cardId);
  if (!ctx) return false;
  const { slug, key } = ctx;
  panel.innerHTML = '<div class="analysis-detail"><div class="analysis-detail__hint">載入緊完整分析…</div></div>';
  const bundle = await loadAnalysisBundle(slug);
  const raw = bundle ? bundle[key] : null;
  if (!raw) {
    // Say so rather than showing an empty document: "no chapters" and "the
    // text did not load" look identical otherwise.
    panel.innerHTML = '<div class="analysis-detail"><div class="analysis-detail__hint">完整分析載入唔到（可能離線，或者呢個檔案未發佈）。其餘資料唔受影響。</div></div>';
    return false;
  }
  const sections = buildHorseAnalysisSections({ raw_text: raw, data_readout: ctx.rows });
  panel.innerHTML = renderAnalysisDetail(sections, cardId);
  const meta = btn.querySelector('.horse-card__expand-meta');
  if (meta) meta.innerHTML = `${sections.length} 個章節 <span class="horse-card__expand-chevron" aria-hidden="true">⌄</span>`;
  delete btn.dataset.analysisLazy;   // loaded once; keep the DOM
  return true;
}

function toggleCard(id, btn) {
  const el = document.getElementById(id + '-detail');
  if (!el) return;
  const isCollapsed = el.classList.contains('expand-animate--collapsed');
  const label = btn.querySelector('.horse-card__expand-label');
  if (isCollapsed && btn.dataset.analysisLazy) {
    // Fetch first, then re-enter so the height animation measures real content.
    fillLazyAnalysis(el, btn, id).then(() => toggleCard(id, btn));
    return;
  }
  if (isCollapsed) {
    el.style.maxHeight = el.scrollHeight + 'px';
    el.classList.remove('expand-animate--collapsed');
    btn.classList.add('is-expanded');
    btn.setAttribute('aria-expanded', 'true');
    if (label) label.textContent = '收起完整分析';
    // Update max-height after content renders
    setTimeout(() => { el.style.maxHeight = el.scrollHeight + 'px'; }, 50);
    setTimeout(() => { el.style.maxHeight = 'none'; }, 400);
  } else {
    el.style.maxHeight = el.scrollHeight + 'px';
    requestAnimationFrame(() => {
      el.classList.add('expand-animate--collapsed');
      el.style.maxHeight = '0';
    });
    btn.classList.remove('is-expanded');
    btn.setAttribute('aria-expanded', 'false');
    if (label) label.textContent = '完整分析';
  }
}

// Parse raw_text into structured sections for compact display
function parseRawTextSections(text) {
  const sectionDefs = [
    { pattern: /(?:🔬|段速法醫|Speed Forensics|Sectional|Step 10)/i, icon: '🔬', title: '段速法醫', color: '#2563EB', bg: '#EFF6FF' },
    { pattern: /(?:⚡|EEM|能量引擎|Energy Engine)/i, icon: '⚡', title: 'EEM 能量引擎', color: '#D97706', bg: '#FFFBEB' },
    { pattern: /(?:寬恕檔案|Forgiveness|修正)/i, icon: '📋', title: '寬恕檔案', color: '#0F766E', bg: '#F0FDFA' },
    { pattern: /(?:🔗|賽績線|Form Line)/i, icon: '🔗', title: '賽績線', color: '#475569', bg: '#F8FAFC' },
    { pattern: /(?:🐴|馬匹剖析|Horse Profile|馬匹資料)/i, icon: '🐴', title: '馬匹剖析', color: '#475569', bg: '#F8FAFC' },
    { pattern: /(?:🧠|核心分析|Core Analysis|核心邏輯)/i, icon: '🧠', title: '核心分析', color: '#1E40AF', bg: '#EFF6FF' },
    { pattern: /(?:💡|最終判讀|結論|Conclusion|Verdict|最終評級|綜合評級)/i, icon: '💡', title: '結論', color: '#059669', bg: '#ECFDF5' },
    { pattern: /(?:評分總覽|7D\s*評分矩陣|評級矩陣|Rating Matrix|Grading)/i, icon: '📊', title: '評級矩陣', color: '#2563EB', bg: '#EFF6FF' },
    { pattern: /(?:數據判讀|Data Readout)/i, icon: '📊', title: '數據判讀', color: '#2563EB', bg: '#EFF6FF' },
    { pattern: /(?:近績解構|Recent Form)/i, icon: '⏱️', title: '近績解構', color: '#475569', bg: '#F8FAFC' },
    { pattern: /(?:⚠️|風險|Risk|警號)/i, icon: '⚠️', title: '風險分析', color: '#DC2626', bg: '#FEF2F2' },
    { pattern: /(?:走勢趨勢|Step \d)/i, icon: '📋', title: '完整分析', color: '#475569', bg: '#F8FAFC' },
  ];
  const lines = text.split('\n');
  const sections = [];
  let current = null;
  let currentLines = [];
  const flush = () => {
    const content = currentLines.join('\n').trim();
    if (content) sections.push({ ...(current || { icon: '📝', title: '分析摘要', color: '#475569', bg: '#F8FAFC' }), content });
    currentLines = [];
    current = null;
  };
  for (const line of lines) {
    const t = line.trim();
    if (/^[-=]{3,}$/.test(t) || !t) { if (currentLines.length && !t) currentLines.push(''); continue; }
    const isH = /^#{1,4}\s+/.test(t) || (t.length < 60 && /^(?:\*{2}|[🔬⚡📋🔗🐴🧠💡📊⚠️✅🏎️🎯])/.test(t));
    if (isH) {
      const clean = t.replace(/^#{1,4}\s*/, '').replace(/\*{1,2}/g, '').trim();
      const match = sectionDefs.find(sd => sd.pattern.test(clean));
      if (match) { flush(); current = match; continue; }
    }
    currentLines.push(t);
  }
  flush();
  if (sections.length === 0) sections.push({ icon: '📋', title: '完整分析', color: '#475569', bg: '#F8FAFC', content: text });
  return sections;
}

// ═══════════════════════════════════════════════
// Comparison View (HKJC dual analyst)
// ═══════════════════════════════════════════════
function renderComparisonView(analyses, analysts) {
  let html = '';

  // MC panels for each analyst
  const mcAnalysts = analysts.filter(a => analyses[a]?.monte_carlo_simulation?.length);
  if (mcAnalysts.length) {
    html += `<div style="margin-bottom:24px"><h2 style="font-size:1rem;font-weight:700;margin-bottom:12px">🎲 Monte Carlo 概率模擬</h2>`;
    mcAnalysts.forEach(analyst => {
      const isK = analyst.toLowerCase() === 'kelvin';
      const headerClr = isK ? '#1D4ED8' : '#0F766E';
      const headerBg = isK ? '#EFF6FF' : '#F0FDFA';
      const headerBdr = isK ? '#BFDBFE' : '#99F6E4';
      html += `<div style="margin-bottom:12px"><div style="font-size:0.78rem;font-weight:700;color:${headerClr};padding:6px 12px;background:${headerBg};border-radius:6px 6px 0 0;border:1px solid ${headerBdr};border-bottom:none">${esc(analyst)} 分析</div>`;

      html += renderMonteCarloPanel(analyses[analyst], true);
      html += '</div>';
    });
    html += '</div>';
  }

  html += '<h2 style="font-size:1rem;font-weight:700;margin-bottom:12px">📋 全場馬匹分析</h2>';
  html += '<div class="comparison-header-row">';
  analysts.forEach(analyst => {
    const isK = analyst.toLowerCase() === 'kelvin';
    const horses = analyses[analyst]?.horses || [];
    html += `<div class="comparison__header comparison__header--${isK?'kelvin':'heison'}" style="border-radius:8px">${esc(analyst)} · ${horses.length} 匹馬</div>`;
  });
  html += '</div>';

  // Sorted lists
  const sortedLists = analysts.map(analyst => {
    const horses = analyses[analyst]?.horses || [];
    const picks = analyses[analyst]?.top_picks || [];
    const pickRankMap = {};
    picks.forEach((p, i) => { pickRankMap[p.horse_number] = i; });
    const sorted = [...horses].sort((a, b) => {
      const aInPicks = pickRankMap.hasOwnProperty(a.horse_number);
      const bInPicks = pickRankMap.hasOwnProperty(b.horse_number);
      if (aInPicks && bInPicks) return pickRankMap[a.horse_number] - pickRankMap[b.horse_number];
      if (aInPicks) return -1;
      if (bInPicks) return 1;
      return sortByGrade(a.final_grade, b.final_grade);
    });
    return {
      sorted, picks, marketRanks: marketRankMap(sorted), analyst,
      raceNumber: analyses[analyst]?.race_number,
    };
  });

  const maxLen = Math.max(...sortedLists.map(s => s.sorted.length));
  for (let i = 0; i < maxLen; i++) {
    html += '<div class="comparison-paired-row">';
    sortedLists.forEach((list, colIdx) => {
      const horse = list.sorted[i];
      const analystName = analysts[colIdx];
      if (!horse) {
        html += '<div></div>';
        return;
      }
      const bg = i===0?'#D97706':i===1?'#9CA3AF':i===2?'#B45309':i===3?'#2563EB':'#F8FAFC';
      const col = i<4?'#fff':'#64748B';
      html += `<div class="rank-card-row">
        <div class="rank-badge" style="color:${col};background:${bg}">#${i+1}<span class="rank-analyst"> | ${esc(analystName)}</span></div>
        <div class="rank-card-content">${renderHorseCard(horse, list.picks.find(p => p.horse_number === horse.horse_number)?.rank, list.marketRanks, analysisRefFor(list.analyst, list.raceNumber, horse.horse_number))}</div>
      </div>`;
    });
    html += '</div>';
  }

  return html;
}

// ═══════════════════════════════════════════════
// Monte Carlo Panel
// ═══════════════════════════════════════════════
function renderMonteCarloPanel(analysis, noCard) {
  const mc = analysis?.monte_carlo_simulation;
  if (!mc || !mc.length) return '';
  const panelId = 'mc-panel-' + Math.random().toString(36).slice(2,8);
  const divId  = 'mc-body-'  + Math.random().toString(36).slice(2,8);
  const wrap   = noCard
    ? `div style="border:1px solid #E2E8F0;border-radius:0 0 8px 8px;overflow:hidden"`
    : `div class="card" style="margin-bottom:20px;overflow:hidden"`;
  let html = `<${wrap}>`;
  // Header toggle bar
  html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(135deg,#0f2746,#1e3a5f);cursor:pointer;border-bottom:1px solid #E2E8F0" onclick="toggleMC('${divId}','${panelId}')" id="${panelId}">`;
  html += `<div style="display:flex;align-items:center;gap:8px"><span style="font-size:0.9rem">🎲</span>`;
  html += `<span style="color:#fff;font-weight:700;font-size:0.82rem">Monte Carlo 模擬 <span style="font-size:0.68rem;color:#94A3B8;font-weight:400">(10,000 次)</span></span></div>`;
  html += `<span id="${panelId}-arrow" style="color:#94A3B8;font-size:0.65rem">▼ 展開</span></div>`;
  // Table body (starts hidden)
  html += `<div id="${divId}" style="display:none;overflow-x:auto;-webkit-overflow-scrolling:touch">`;
  html += `<table style="width:100%;border-collapse:collapse;font-size:clamp(0.62rem,2vw,0.75rem)">`;
  html += `<thead><tr style="background:#F8FAFC;color:#64748B;font-size:clamp(0.58rem,1.8vw,0.67rem);font-weight:600;white-space:nowrap;border-bottom:2px solid #E2E8F0">`;
  for (const h of ['排名','馬號','馬名','勝出%','賠率','入三甲%','入四甲%','法證排','差異']) {
    html += `<th style="padding:6px 8px;text-align:${h==='馬名'?'left':'center'}">${h}</th>`;
  }
  html += `</tr></thead><tbody>`;
  const ICONS = ['🥇','🥈','🥉','🏅','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟','🔢'];
  mc.forEach((p, i) => {
    const icon   = ICONS[i] || (i+1);
    const rowBg  = i===0?'rgba(254,243,199,0.4)':i===1?'rgba(241,245,249,0.5)':i===2?'rgba(255,247,237,0.4)':i%2===0?'#F8FAFC':'#fff';
    const winCol = i===0?'#B45309':i<3?'#1E40AF':'#475569';
    const divClr = (p.divergence||'').includes('✅')?'#059669':(p.divergence||'').includes('❌')?'#DC2626':'#64748B';
    const divBg  = (p.divergence||'').includes('✅')?'rgba(209,250,229,0.5)':(p.divergence||'').includes('❌')?'rgba(254,226,226,0.5)':'transparent';
    html += `<tr style="background:${rowBg};border-bottom:1px solid #F1F5F9">`;
    html += `<td style="padding:7px 8px;text-align:center;font-size:0.85rem">${icon}</td>`;
    html += `<td style="padding:7px 8px;text-align:center">`
      + (p.horse_number
        ? `<span style="background:#DBEAFE;color:#1E40AF;min-width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:0.75rem;padding:0 4px">${esc(p.horse_number)}</span>`
        : `<span style="color:#94A3B8">—</span>`)
      + `</td>`;
    html += `<td style="padding:7px 8px;color:#1E293B;font-weight:600;white-space:nowrap">${esc(p.horse_name)}</td>`;
    html += `<td style="padding:7px 8px;text-align:center;font-weight:800;color:${winCol}">${p.win_pct.toFixed(1)}%</td>`;
    html += `<td style="padding:7px 8px;text-align:center;color:#059669;font-weight:600;white-space:nowrap">${esc(p.predicted_odds||'—')}</td>`;
    html += `<td style="padding:7px 8px;text-align:center;color:#475569">${p.top3_pct!=null?p.top3_pct.toFixed(1)+'%':'—'}</td>`;
    html += `<td style="padding:7px 8px;text-align:center;color:#64748B">${p.top4_pct!=null?p.top4_pct.toFixed(1)+'%':'—'}</td>`;
    html += `<td style="padding:7px 8px;text-align:center;color:#6366F1;font-weight:600;font-size:0.7rem;white-space:nowrap">${esc(p.forensic_rank||'—')}</td>`;
    html += `<td style="padding:7px 8px;text-align:center;font-size:0.7rem;font-weight:600;color:${divClr};background:${divBg};white-space:nowrap">${esc(p.divergence||'—')}</td>`;
    html += `</tr>`;
  });
  html += `</tbody></table></div></${noCard?'div':'div'}>`;
  return html;
}

function toggleMC(divId, panelId) {
  const el = document.getElementById(divId);
  const arrow = document.getElementById(panelId + '-arrow');
  if (!el) return;
  const shown = el.style.display !== 'none';
  el.style.display = shown ? 'none' : 'block';
  if (arrow) arrow.textContent = shown ? '▼ 展開' : '▲ 收起';
}

// ═══════════════════════════════════════════════
// 🗺️ Battlefield Overview Card
// ═══════════════════════════════════════════════
function renderBattlefieldCard(bfText, paceText) {
  if (!bfText && !paceText) return '';
  if (!bfText) {
    return `<div class="card" style="margin-bottom:16px;padding:12px 16px;display:flex;align-items:center;gap:10px"><span style="font-size:1rem">🏃</span><div><div style="font-size:0.72rem;font-weight:700;color:#64748B">步速預測</div><div style="font-size:0.85rem;font-weight:700;color:#E2E8F0;margin-top:2px">${esc(paceText)}</div></div></div>`;
  }

  // — Parse key-value table
  const kv = {};
  const kvRe = /\|\s*\*{0,2}([^|\n*]+?)\*{0,2}\s*\|\s*\*{0,2}(`[^`]*`|[^|\n*]+?)\*{0,2}\s*\|/g;
  let m;
  while ((m = kvRe.exec(bfText)) !== null) {
    const k = m[1].trim().replace(/\*+/g,'');
    const v = m[2].trim().replace(/\*+/g,'').replace(/`/g,'');
    if (k && v && !/^[-:]+$/.test(k) && k !== '項目' && k !== '內容') kv[k] = v;
  }

  // — Determine pace + colour
  const paceRaw = kv['步速預測'] || kv['步速'] || '';
  const paceColor = /fast|\u5feb/i.test(paceRaw) ? '#EF4444'
    : /slow|\u6162/i.test(paceRaw)               ? '#3B82F6'
    : /mid|\u4e2d/i.test(paceRaw)                ? '#F59E0B' : '#10B981';

  // — Speed Map text
  const smIdx = bfText.indexOf('Speed Map');
  let smLines = [];
  if (smIdx >= 0) {
    smLines = bfText.slice(smIdx, smIdx+600).split('\n')
      .slice(1,6).map(l => l.trim())
      .filter(l => l && !l.startsWith('#') && !l.startsWith('|') && !l.startsWith('-'));
  }

  // — Build card
  let h = `<div class="card" style="margin-bottom:16px;overflow:hidden">`;

  // Header
  h += `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,rgba(37,99,235,0.12),rgba(124,58,237,0.08));border-bottom:1px solid rgba(255,255,255,0.07)">`;
  h += `<span style="font-size:1rem">🗺️</span>`;
  h += `<span style="font-weight:800;font-size:0.85rem;color:#F1F5F9">戰場全景</span>`;
  if (paceRaw) h += `<span style="background:${paceColor};color:#fff;padding:2px 10px;border-radius:999px;font-size:0.68rem;font-weight:800">${esc(paceRaw)}</span>`;
  if (kv['賻事格局']) h += `<span style="background:rgba(255,255,255,0.07);color:#CBD5E1;padding:2px 8px;border-radius:999px;font-size:0.65rem;font-weight:600">${esc(kv['賻事格局'].split('/')[0].trim())}</span>`;
  h += `</div>`;

  // Info chips row
  const chips = [];
  if (kv['賻事類型']) chips.push({icon:'🏇',label:'類型',val:kv['賻事類型']});
  if (kv['天氣 / 場地'] && !/詳見/.test(kv['天氣 / 場地'])) chips.push({icon:'🌤️',label:'天氣',val:kv['天氣 / 場地']});
  if (kv['賻事格局']) chips.push({icon:'🏆',label:'格局',val:kv['賻事格局']});

  if (chips.length) {
    h += `<div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,0.05)">`;
    chips.forEach(c => {
      h += `<div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.09);border-radius:6px;padding:3px 10px;line-height:1.4"><span style="font-size:0.6rem;color:#64748B;display:block">${c.icon} ${esc(c.label)}</span><span style="font-size:0.72rem;color:#E2E8F0;font-weight:600">${esc(c.val.slice(0,40))}</span></div>`;
    });
    h += `</div>`;
  }

  // 跑道偏差
  const bias = kv['跑道偏差'] || kv['場地偏差'] || '';
  if (bias && bias.length > 5) {
    h += `<div style="padding:8px 14px;border-bottom:1px solid rgba(255,255,255,0.05)">`;
    h += `<div style="font-size:0.6rem;font-weight:700;color:#F59E0B;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">⚡ 跑道偏差</div>`;
    h += `<div style="font-size:0.72rem;color:#CBD5E1;line-height:1.65">${esc(bias.slice(0,250))}</div>`;
    h += `</div>`;
  }

  // Speed Map
  if (smLines.length) {
    h += `<div style="padding:8px 14px">`;
    h += `<div style="font-size:0.6rem;font-weight:700;color:#60A5FA;letter-spacing:0.06em;margin-bottom:4px">📍 Speed Map</div>`;
    smLines.forEach(l => {
      h += `<div style="font-size:0.7rem;color:#94A3B8;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;line-height:1.5">${esc(l)}</div>`;
    });
    h += `</div>`;
  }

  h += `</div>`;
  return h;
}

// ═══════════════════════════════════════════════
// Single Analyst View
// ═══════════════════════════════════════════════
function renderSingleAnalystView(analysis, analystName) {
  if (!analysis) return '';
  const picks = analysis.top_picks || [];
  const horses = analysis.horses || [];
  const isK = (analystName||'').toLowerCase() === 'kelvin';

  // Sort horses: top_picks order first, then remaining by grade
  const pickRankMap = {};
  picks.forEach((p, i) => { pickRankMap[p.horse_number] = i; });
  const sortedHorses = [...horses].sort((a, b) => {
    const aInPicks = pickRankMap.hasOwnProperty(a.horse_number);
    const bInPicks = pickRankMap.hasOwnProperty(b.horse_number);
    if (aInPicks && bInPicks) return pickRankMap[a.horse_number] - pickRankMap[b.horse_number];
    if (aInPicks) return -1;
    if (bInPicks) return 1;
    return sortByGrade(a.final_grade, b.final_grade);
  });

  let html = '';
  // Monte Carlo simulation panel
  html += renderMonteCarloPanel(analysis);

  // Horse cards
  html += `<h2 style="font-size:1rem;font-weight:700;margin-bottom:12px">📋 全場馬匹分析</h2>`;
  html += `<div class="comparison__column" style="max-width: 900px"><div class="comparison__header comparison__header--${isK?'kelvin':'heison'}">${esc(analystName||'Analyst')} · ${horses.length} 匹馬</div><div class="comparison__body"><div class="horse-grid" style="grid-template-columns:minmax(0, 1fr)">`;
  const fieldMarketRanks = marketRankMap(horses);
  sortedHorses.forEach((horse, idx) => {
    const bg = idx===0?'#D97706':idx===1?'#9CA3AF':idx===2?'#B45309':idx===3?'#2563EB':'#F8FAFC';
    const col = idx<4?'#fff':'#64748B';
    html += `<div class="rank-card-row">
      <div class="rank-badge" style="color:${col};background:${bg}">#${idx+1}</div>
      <div class="rank-card-content">${renderHorseCard(horse, picks.find(p => p.horse_number === horse.horse_number)?.rank, fieldMarketRanks, analysisRefFor(analystName, analysis.race_number, horse.horse_number))}</div>
    </div>`;
  });
  html += '</div></div></div>';
  return html;
}

function getFilteredROI() {
  const roi = DASHBOARD_DATA.roi || {};
  // The permanent ROI ledger is authoritative.  Tombstones suppress matching
  // records in the pre-baked snapshot, and local panel drafts never overwrite
  // committed results.
  const baseMap = {};
  const fromLedger = new Set();
  (roi.bets || []).forEach(b => {
    const key = `${b.date}|${b.venue}|${b.race_number}|${b.horse_number}`;
    baseMap[key] = { ...b, _ledger_key: key };
  });
  roiLedger.forEach(b => {
    const key = b._ledger_key || `${b.date}|${b.venue}|${b.race_number}|${b.horse_number}`;
    if (b._deleted) { delete baseMap[key]; fromLedger.delete(key); }
    else { baseMap[key] = b; fromLedger.add(key); }
  });
  const allBets = Object.values(baseMap);
  allBets.sort((a,b) => (a.date||'').localeCompare(b.date||''));

  // Apply region filter
  const bets = roiRegionFilter ? allBets.filter(b => b.region === roiRegionFilter) : allBets;

  // Recompute totals
  const totalStake = bets.reduce((s,b) => s + (b.stake||0), 0);
  const totalPayout = bets.reduce((s,b) => s + (b.payout||0), 0);
  const totalProfit = bets.reduce((s,b) => s + (b.net_profit||0), 0);
  const wins = bets.filter(b => b.status === 'won').length;
  const losses = bets.filter(b => b.status === 'lost').length;
  const winRate = (wins + losses) > 0 ? Math.round(wins/(wins+losses)*1000)/10 : 0;
  const roiPct = totalStake > 0 ? Math.round(totalProfit/totalStake*1000)/10 : 0;
  let cum = 0;
  const settled = bets.filter(b => b.status !== 'pending');
  const rp = settled.map(b => { cum += (b.net_profit||0); return {date:b.date,venue:b.venue,race_number:b.race_number,horse_name:b.horse_name,profit:b.net_profit||0,cumulative:Math.round(cum*100)/100}; });
  // Daily breakdown
  const dm = {};
  bets.forEach(b => {
    const k = `${b.date}-${b.venue}`;
    if (!dm[k]) dm[k] = {date:b.date,venue:b.venue,region:b.region,bets:0,stake:0,payout:0,profit:0,wins:0};
    dm[k].bets++; dm[k].stake += b.stake||0; dm[k].payout += b.payout||0; dm[k].profit += b.net_profit||0;
    if (b.status==='won') dm[k].wins++;
  });
  const db = Object.values(dm).map(d => ({...d, profit:Math.round(d.profit*100)/100}));
  db.sort((a,b) => b.date.localeCompare(a.date));
  // Where the rows came from, so the page can say what this ROI actually covers.
  // Without it the ROI tab (snapshot + ledger) and the Portfolio tab (ledger only)
  // silently disagree about how many bets you have made.
  const ledgerCount = bets.filter(b => fromLedger.has(b._ledger_key || `${b.date}|${b.venue}|${b.race_number}|${b.horse_number}`)).length;
  const sources = {ledger: ledgerCount, snapshot: bets.length - ledgerCount};
  return {total_bets:bets.length,total_stake:Math.round(totalStake*100)/100,total_payout:Math.round(totalPayout*100)/100,total_profit:Math.round(totalProfit*100)/100,roi_pct:roiPct,win_rate:winRate,wins,losses,running_profit:rp,daily_breakdown:db,side_roi:roi.side_roi,bets,sources};
}

function renderRoiScopeNote(roi) {
  const s = roi.sources || {ledger: 0, snapshot: 0};

  if (s.snapshot) parts.push(`歷史記錄 ${s.snapshot} 注`);
  if (s.ledger) parts.push(`App 記錄 ${s.ledger} 注`);
  const breakdown = parts.length > 1 ? `（${parts.join(' + ')}）` : '';
  const scope = roiRegionFilter ? (roiRegionFilter === 'hkjc' ? '🇭🇰 HKJC' : '🇦🇺 AU') : '全部馬場';
  return `<div class="scope-note">

function renderProfitChart(data) {
  if (!data.length) return '';
  const values = data.map(d => d.cumulative);
  const max = Math.max(...values, 0), min = Math.min(...values, 0);
  const range = max - min || 1;
  const W=800,H=300,pL=50,pB=30,pT=20,pR=20;
  const cW=W-pL-pR, cH=H-pT-pB;
  const zeroY = pT + cH - ((0-min)/range)*cH;
  const pts = data.map((d,i) => ({x:pL+(i/(data.length-1||1))*cW, y:pT+cH-((d.cumulative-min)/range)*cH, date:d.date}));
  // SVG lines
  let lines = '';
  for (let i=1;i<pts.length;i++) {
    const col = (values[i]>=0 && values[i-1]>=0) ? '#059669' : '#DC2626';
    lines += `<line x1="${pts[i-1].x}" y1="${pts[i-1].y}" x2="${pts[i].x}" y2="${pts[i].y}" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
  }
  // Fill path
  const fillPts = pts.map(p => `L ${p.x},${p.y}`).join(' ');
  const fillPath = `M ${pts[0].x},${zeroY} ${fillPts} L ${pts[pts.length-1].x},${zeroY} Z`;
  const last = pts[pts.length-1];
  const lastV = values[values.length-1];
  const isUp = lastV >= 0;
  const gradId = isUp ? 'profitFill' : 'lossFill';
  // Y ticks
  let yTicks = '';
  const step = range/4;
  for (let i=0;i<=4;i++) {
    const val = min+step*i;
    const y = pT+cH-((val-min)/range)*cH;
    yTicks += `<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="#F1F5F9" stroke-width="1"/><text x="${pL-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#94A3B8">$${Math.round(val)}</text>`;
  }
  // Month labels
  const seen = new Set();
  let mLabels = '';
  let prevX = -100;
  data.forEach((d,i) => {
    const ds = d.date||'';
    let mk='',label='';
    if (ds.includes('-')&&ds.length>=7) { const p=ds.split('-'); mk=p[0]+'-'+p[1]; const m=parseInt(p[1]); const mn=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; label=`${mn[m]||m}/${p[0].slice(-2)}`; }
    else if (ds.includes('.')) { const m=ds.split('.')[0]; mk=m; const mn={'1':'Jan','2':'Feb','3':'Mar'}; label=`${mn[m]||m}/26`; }
    if (mk && !seen.has(mk) && pts[i].x - prevX > 60) { seen.add(mk); prevX=pts[i].x;
      mLabels += `<line x1="${pts[i].x}" y1="${pT}" x2="${pts[i].x}" y2="${pT+cH}" stroke="#F1F5F9" stroke-dasharray="2,4" stroke-width="1"/><text x="${pts[i].x}" y="${H-6}" text-anchor="middle" font-size="10" fill="#64748B" font-weight="600">${label}</text>`;
    }
  });
  // Interactive hover dots for each data point
  const chartId = 'roi-chart-' + Math.random().toString(36).slice(2,8);
  let hoverDots = '';
  data.forEach((d, i) => {
    const col = values[i] >= 0 ? '#059669' : '#DC2626';
    const pStr = values[i] >= 0 ? '+' : '';
    hoverDots += `<circle cx="${pts[i].x}" cy="${pts[i].y}" r="12" fill="transparent" style="cursor:pointer" 
      onmouseenter="showChartTip('${chartId}',event,${pts[i].x},${pts[i].y},'${esc(d.date)} · ${esc(d.horse_name||'')}','${pStr}$${d.cumulative}','${col}')" 
      onmouseleave="hideChartTip('${chartId}')"/>`;
    hoverDots += `<circle cx="${pts[i].x}" cy="${pts[i].y}" r="3" fill="${col}" opacity="0" pointer-events="none" class="chart-dot-${chartId}-${i}"/>`;
  });
  return `<div class="card" style="margin-bottom:16px;padding:16px;position:relative"><div style="font-size:0.8rem;font-weight:700;margin-bottom:8px;color:#64748B">📊 累計損益走勢</div>
    <div id="${chartId}-tip" class="chart-tooltip"></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:320px" id="${chartId}">
      <defs><linearGradient id="profitFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#059669" stop-opacity="0.3"/><stop offset="100%" stop-color="#059669" stop-opacity="0.02"/></linearGradient>
      <linearGradient id="lossFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DC2626" stop-opacity="0.02"/><stop offset="100%" stop-color="#DC2626" stop-opacity="0.3"/></linearGradient></defs>
      ${yTicks}
      <line x1="${pL}" y1="${zeroY}" x2="${W-pR}" y2="${zeroY}" stroke="#CBD5E1" stroke-dasharray="4,4" stroke-width="1"/>
      <text x="${pL-6}" y="${zeroY+3}" text-anchor="end" font-size="10" fill="#64748B" font-weight="600">$0</text>
      <path d="${fillPath}" fill="url(#${gradId})"/>
      ${lines}
      ${hoverDots}
      <circle cx="${last.x}" cy="${last.y}" r="4" fill="${isUp?'#059669':'#DC2626'}"/>
      <text x="${last.x}" y="${last.y-10}" text-anchor="end" font-size="12" font-weight="700" fill="${isUp?'#059669':'#DC2626'}">${isUp?'+':''}$${lastV}</text>
      ${mLabels}
    </svg></div>`;
}
