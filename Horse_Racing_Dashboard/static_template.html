function sportsFeedSnapshot(sport) {
  return DASHBOARD_DATA.sports_feed?.sports?.[sport] || null;
}

function hasCurrentSportsFeed(sport) {
  const snapshot = sportsFeedSnapshot(sport);
  return Boolean(snapshot && ['valid', 'partial'].includes(snapshot.validation_status));
}

function hasLiveSportsFeed(sport) {
  const snapshot = sportsFeedSnapshot(sport);
  return Boolean(hasCurrentSportsFeed(sport) && snapshot.recommendations?.length);
}

function sportsHistory(sport) {
  // Gate on the feed actually HAVING recommendations (hasLiveSportsFeed), not on it
  // merely being valid (hasCurrentSportsFeed). A valid tennis feed whose evidence
  // gate passed nothing returns [], and gating on validity alone made that empty
  // list win — blanking the workspace and hiding every historical case. The
  // stricter the gate got, the emptier the page became.
  if (hasLiveSportsFeed(sport)) return sportsFeedSnapshot(sport).recommendations || [];
  return DASHBOARD_DATA.sports_history?.[sport] || [];
}

function sportsRecords(sport) {
  return (sportsBetLedger || [])
    .filter(record => record && !record._deleted && record.sport === sport)
    .sort((a, b) => String(b.event_date || '').localeCompare(String(a.event_date || '')));
}

function pct(value, digits = 1) {
  const number = Number(value);
  return Number.isFinite(number) ? `${(number * 100).toFixed(digits)}%` : '—';
}

function sportsMetricLabels(item, sport) {
  const metrics = item.metrics || {};
  const rows = [];
  if (sport === 'nba') {
    if (metrics.monte_carlo != null) rows.push(`Monte Carlo ${pct(metrics.monte_carlo)}`);
    if (metrics.factor_model != null) rows.push(`8-Factor ${pct(metrics.factor_model)}`);
    if (metrics.banker_confidence != null) rows.push(`原穩膽信心 ${pct(metrics.banker_confidence)}`);
    if (metrics.last_game_points != null) rows.push(`L1 ${metrics.last_game_points} PTS`);
    if (metrics.coefficient_of_variation != null) rows.push(`CoV ${Number(metrics.coefficient_of_variation).toFixed(3)}`);
    if (metrics.minutes != null) rows.push(`實際 ${metrics.minutes} MIN`);
  } else {
    if (metrics.clv != null) rows.push(`CLV ${Number(metrics.clv) >= 0 ? '+' : ''}${pct(metrics.clv)}`);
    if (metrics.hit_probability != null) rows.push(`校準命中 ${pct(metrics.hit_probability)}`);
    else if (metrics.model_probability != null) rows.push(`模型概率 ${pct(metrics.model_probability)}`);
    if (metrics.market_fair_probability != null) rows.push(`市場 fair ${pct(metrics.market_fair_probability)}`);
    if (metrics.edge != null) rows.push(`Edge +${pct(metrics.edge)}`);
    if (metrics.expected_value != null) rows.push(`EV +${pct(metrics.expected_value)}`);
    if (metrics.minimum_acceptable_odds != null) rows.push(`最低可接受 ${Number(metrics.minimum_acceptable_odds).toFixed(2)}`);
    if (metrics.confidence_score != null) rows.push(`公式可信度 ${Number(metrics.confidence_score).toFixed(0)}/100`);
    else if (metrics.confidence != null) rows.push(`信心 ${Number(metrics.confidence).toFixed(0)}%`);
  }
  return rows;
}

function outcomeLabel(value) {
  return ({ won: '✅ 命中', lost: '❌ 落空', pending: '⏳ 待賽果', void: '↩️ 取消', review: '🔎 檢討案例' })[value] || '待檢視';
}

function sportsLegLabel(leg) {
  if (typeof leg === 'string') return leg;
  const event = leg?.event_name ? `${leg.event_name} · ` : '';
  const market = leg?.market ? `${leg.market} · ` : '';
  const odds = leg?.odds != null ? ` @ ${Number(leg.odds).toFixed(2)}` : '';
  const status = leg?.status && leg.status !== 'pending' ? ` · ${sportsStatusLabel(leg.status)}` : '';
  return `${event}${market}${leg?.selection || '未命名 leg'}${odds}${status}`;
}

// A bare side/line ("Over 1.5", "U 5.5", "O2.5") is meaningless on its own — tennis
// puts the subject in `market` and the side in `selection`, so those have to be read
// together. NBA already ships a self-describing selection ("Jalen Brunson 25+") with
// `market` as a category, which belongs above it as a kicker instead.
const BARE_LINE_RE = /^(?:over|under|o|u)\s*[\d.]+$/i;

function sportsPickLines(item) {
  const market = String(item?.market || '').trim();
  const selection = String(item?.selection || '').trim();
  if (!selection) return { kicker: '', headline: market || '—' };
  if (!market) return { kicker: '', headline: selection };
  if (BARE_LINE_RE.test(selection)) return { kicker: '', headline: `${market} · ${selection}` };
  return { kicker: market, headline: selection };
}

// Legs arrive either as objects from the live pipeline or as pre-formatted strings in
// the archived cases. Split off price and status either way so they can be columns
// rather than buried in a sentence.
function sportsLegParts(leg) {
  if (leg && typeof leg === 'object') {
    return {
      label: [leg.event_name, leg.market, leg.selection].filter(Boolean).join(' · ') || '未命名 leg',
      odds: leg.odds == null ? null : Number(leg.odds),
      status: leg.status || null,
    };
  }
  const text = String(leg || '').trim();
  const oddsMatch = text.match(/\s@\s([\d.]+)/);
  const statusMatch = text.match(/·\s*(WON|LOST|VOID|PENDING)\s*$/i);
  let label = text;
  if (oddsMatch) label = label.replace(oddsMatch[0], '');
  if (statusMatch) label = label.replace(statusMatch[0], '');
  return {
    label: label.replace(/·\s*$/, '').trim() || '未命名 leg',
    odds: oddsMatch ? Number(oddsMatch[1]) : null,
    status: statusMatch ? statusMatch[1].toLowerCase() : null,
  };
}

// The bet itself, at the top of the card and impossible to miss: which selection, at
// what price, and for a combo every leg spelled out. The archived combo case's own
// note asks for exactly this ("combo 卡片應逐腳顯示，而唔係只顯示合併賠率").
function renderSportsPick(item, sport) {
  const isCombo = item.bet_type === 'combo' || (item.legs || []).length > 1;
  const reviewOnly = item.outcome === 'review';
  const priceText = item.odds == null
    ? `<span class="pick-block__noprice">${item.odds_status === 'not_archived' ? '原始賠率未存檔 · 落注時輸入你實際價' : '未有已驗證賠率'}</span>`
    : `<span class="pick-block__price">${isCombo ? '合併賠率' : '賠率'} <strong>${Number(item.odds).toFixed(2)}</strong></span>`;

  if (reviewOnly) {
    // Not a bet — a modelling lesson. Labelling it as one would be actively misleading
    // on a page whose job is telling you what to back.
    const { kicker, headline } = sportsPickLines(item);
    return `<div class="pick-block pick-block--note">
      <div class="pick-block__label">📝 觀察筆記 · 唔係投注建議</div>
      ${kicker ? `<div class="pick-block__kicker">${esc(kicker)}</div>` : ''}
      <div class="pick-block__headline">${esc(headline)}</div>
    </div>`;
  }

  if (isCombo) {
    const legs = (item.legs || []).map((leg, index) => {
      const { label, odds, status } = sportsLegParts(leg);
      return `<li class="pick-leg${status ? ` pick-leg--${esc(status)}` : ''}">
        <span class="pick-leg__n">${index + 1}</span>
        <span class="pick-leg__label">${esc(label)}</span>
        ${odds == null ? '' : `<span class="pick-leg__odds">${odds.toFixed(2)}</span>`}
        ${status ? `<span class="pick-leg__status">${esc(sportsStatusLabel(status))}</span>` : ''}
      </li>`;
    }).join('');
    return `<div class="pick-block pick-block--combo">
      <div class="pick-block__label">🎯 落注 · ${(item.legs || []).length} 腳 combo（全中才派彩）</div>
      <ol class="pick-legs">${legs}</ol>
      <div class="pick-block__foot">${priceText}</div>
    </div>`;
  }

  const { kicker, headline } = sportsPickLines(item);
  return `<div class="pick-block">
    <div class="pick-block__label">🎯 落注</div>
    ${kicker ? `<div class="pick-block__kicker">${esc(kicker)}</div>` : ''}
    <div class="pick-block__headline">${esc(headline)}</div>
    <div class="pick-block__foot">${priceText}</div>
  </div>`;
}

function renderHistoryCard(item, sport) {
  const context = item.context || {};
  const contextLabels = sport === 'tennis'
    ? [item.category ? `Tier ${String(item.category).toUpperCase()}` : '', context.tour, context.round, context.tournament].filter(Boolean)
    : [item.category ? String(item.category).toUpperCase() : ''];
  const metrics = [...contextLabels, ...sportsMetricLabels(item, sport)]
    .map(label => `<span class="metric-chip">${esc(label)}</span>`).join('');
  const odds = item.odds == null
    ? '<span class="odds-missing">原始賠率未存檔 · 落注時手動輸入</span>'
    : `${item.odds_status === 'sportsbet_extracted' ? 'Sportsbet 提取賠率' : '分析賠率'} <strong>${Number(item.odds).toFixed(2)}</strong>`;
  const canConfirm = item.decision === 'BET' && item.outcome === 'pending' && Number(item.odds) > 1;
  const confirmation = canConfirm
    ? renderInlineBetDraft(item, sport)
    : `<div class="history-card__review-only">${item.outcome !== 'pending'
      ? '舊案例只供檢討，唔會加入新投注或 ROI。'

  // Fixture and pick stay always-visible; the model commentary folds away. <details>
  // rather than a JS toggle so there is no open/closed state to lose when render()
  // rebuilds this innerHTML on the next bet-sync tick.
  return `<article class="history-card">

      <div class="history-card__fixture">

      <summary class="history-card__more-summary">分析詳情、風險同資料來源</summary>

function renderSportsHistory(sport) {
  const items = sportsHistory(sport);
  const live = hasLiveSportsFeed(sport);
  const snapshot = sportsFeedSnapshot(sport);
  const coverage = sport === 'tennis' ? snapshot?.coverage : null;
  const strategy = sport === 'tennis' ? snapshot?.strategy : null;
  const tennisFamilyLabels = {
    match_total_aces: 'Match Total Aces',
    player_aces: 'Player Aces',
    player_double_faults: 'Player Double Faults',
    player_total_games: 'Player Total Games',
    player_win_a_set: 'Player Win ≥1 Set',
    first_set_winner: 'Set 1 Winner',
    player_game_handicap: 'Player Game Handicap',
    player_set_handicap: 'Player Set Handicap',
    player_exact_set_score: 'Player Exact Set Score',
  };
  const familyProgress = strategy?.families
    ? Object.entries(strategy.families)
        .map(([name, stats]) => `${tennisFamilyLabels[name] || name} ${Number(stats?.scorecard_settled || 0)}/120`)
        .join(' · ')
    : '';
  const strategyValidated = strategy?.status === 'VALIDATED_SINGLE' || strategy?.status === 'VALIDATED_2_LEG';
  const strategyNotice = strategy
    ? `<div class="sports-notice"><span>${strategyValidated ? '✅' : '🧪'}</span><span>
        Prop 策略：${esc(strategy.status || 'RESEARCH_ONLY')} ·
        ${strategyValidated ? '已通過正式推薦閘' : '逐 family 研究追蹤，暫停正式推薦'} ·
        已驗證分類 ${esc((strategy.enabled_families || []).map(name => tennisFamilyLabels[name] || name).join('、') || '未有')}。<br>
        Family 記分卡：${esc(familyProgress || '未有已結算樣本')}。
      </span></div>`
    : '';
  const coverageNotice = coverage
    ? `<div class="sports-notice"><span>📡</span><span>
        今日賽程 ${Number(coverage.fixtures_found || 0)} 場 ·
        Sportsbet 已開盤 ${Number(coverage.sportsbet_priced_matches || 0)} 場
        （可建模單打 ${Number(coverage.singles_candidates ?? coverage.sportsbet_priced_matches ?? 0)} 場）·
        已建模 ${Number(coverage.modelled_matches || 0)} 場 ·
        未入模型 ${Number(coverage.unmodelled_priced_matches || 0)} 場 ·
        覆蓋 ${coverage.priced_ratio == null ? '—' : pct(coverage.priced_ratio)}。<br>
        最後 Sportsbet 抓取：${esc(coverage.latest_sportsbet_scrape || '—')} ·
        最後分析：${esc(coverage.latest_analysis || snapshot?.generated_at || '—')}
      </span></div>`
    : '';
  if (!items.length) {
    const message = hasCurrentSportsFeed(sport)
      ? '今次分析已完成，但未有通過模型及風控門檻嘅建議。'
      : '未有可用歷史分析。';
    return `${coverageNotice}${strategyNotice}<div class="sports-empty">${message}</div>`;
  }
  // Today's analysis ran and passed nothing, so the cards below are history. Say so
  // outright — otherwise old cases read as today's picks, which is the worst possible
  // way to be wrong on a betting page.
  const gatedTodayNotice = !live && hasCurrentSportsFeed(sport)
    ? `<div class="sports-notice sports-notice--gated"><span>🚫</span><span><strong>今日冇合格建議。</strong>今次分析已完成，但冇任何選擇通過模型同風控門檻，所以${sport === 'nba' ? 'NBA' : 'Tennis'}今日<strong>唔應該落注</strong>。下面係過往案例，只供檢討。</span></div>`
    : '';
  const notice = live
    ? `<div class="sports-notice"><span>✅</span><span>正式 ${sport === 'nba' ? 'NBA Wong Choi artifacts' : 'tennis_wc.db'} live feed · ${esc(snapshot.analysis_run_id || '')} · ${items.length} 個已驗證建議。所有 odds／legs 直接由 pipeline 匯出；下一次新分析會替換呢個建議清單，但唔會改動已確認投注。</span></div>`
    : sport === 'nba'
    ? `<div class="sports-notice"><span>⚠️</span><span>NBA 呢批係真實 Reflector 案例，但舊版流程無保存原始 Sportsbet 賠率。為免作假，畫面唔會估賠率；加入投注單時要輸入你實際落注價。</span></div>`
    : `<div class="sports-notice"><span>🧪</span><span>Tennis 呢批由 2026-07-23 每日報告同已結算資料組成，用嚟測試「模型訊號 → 落注 → 結算 → 檢討」嘅最佳讀法；唔代表今日建議。</span></div>`;
  // Coverage and strategy state are diagnostics, not answers. Stacked open they pushed
  // the actual picks about two screens down the phone — the opposite of what this page
  // is for. The gated/live notice stays out front because it IS the answer.
  const diagnostics = coverageNotice || strategyNotice
    ? `<details class="sports-diagnostics">
        <summary class="sports-diagnostics__summary">資料覆蓋同策略狀態</summary>
        ${coverageNotice}${strategyNotice}
      </details>`
    : '';
  return `${gatedTodayNotice}${notice}${diagnostics}<div class="history-grid">${items.map(item => renderHistoryCard(item, sport)).join('')}</div>`;
}

function calculateSportsRoi(records) {
  const all = (records || []).filter(record => record && !record._deleted);
  const settled = all.filter(record => ['won', 'lost', 'void'].includes(record.status));
  const totalStake = settled.reduce((sum, record) => sum + Number(record.stake || 0), 0);
  const totalPayout = settled.reduce((sum, record) => sum + Number(record.payout || 0), 0);
  const totalProfit = settled.reduce((sum, record) => sum + Number(record.profit || 0), 0);
  const wins = settled.filter(record => record.status === 'won').length;
  const losses = settled.filter(record => record.status === 'lost').length;
  return {
    total_bets: all.length,
    settled_bets: settled.length,
    total_stake: Number(totalStake.toFixed(2)),
    total_payout: Number(totalPayout.toFixed(2)),
    total_profit: Number(totalProfit.toFixed(2)),
    roi_pct: totalStake ? Number((totalProfit / totalStake * 100).toFixed(1)) : 0,
    win_rate: wins + losses ? Number((wins / (wins + losses) * 100).toFixed(1)) : 0,
  };
}

function enableInlineBetField(button, fieldName) {
  const form = button.closest('.inline-bet-confirm');
  const input = form?.querySelector(`[name="${fieldName}"]`);

  const shouldEdit = input.hasAttribute('readonly');
  if (shouldEdit) {
    input.removeAttribute('readonly');
    button.setAttribute('aria-pressed', 'true');
    button.textContent = '✓';
    input.focus();
    input.select();
  } else {
    input.setAttribute('readonly', '');
    button.setAttribute('aria-pressed', 'false');
    button.textContent = '✎';
  }
}

function sourceAnalysisSnapshot(source) {
  return {
    metrics: source.metrics || {},
    insight: source.insight || '',
    risk: source.risk || '',
    provenance: source.provenance || '',
    event_date: source.event_date,
    event_name: source.event_name,
    market: source.market,
    selection: source.selection,
    legs: JSON.parse(JSON.stringify(source.legs || [])),
  };
}

function deriveLocalSportsRecord(record) {
  const next = { ...record };
  if (next.bet_type === 'combo' && next.legs?.some(leg => leg.status !== 'pending')) {
    const statuses = next.legs.map(leg => leg.status || 'pending');
    next.status = statuses.includes('lost') ? 'lost'
      : statuses.includes('pending') ? 'pending'
      : statuses.every(status => status === 'void') ? 'void' : 'won';
    const effectiveOdds = next.legs
      .filter(leg => leg.status === 'won')
      .reduce((product, leg) => product * (Number(leg.odds) > 1 ? Number(leg.odds) : 1), 1);
    next.settlement_odds = next.status === 'won' ? effectiveOdds : next.status === 'void' ? 1 : null;
  }
  const payoutOdds = next.settlement_odds ?? next.odds;
  next.payout = next.status === 'won' ? next.stake * payoutOdds : next.status === 'void' ? next.stake : 0;
  next.profit = next.status === 'won' ? next.payout - next.stake : next.status === 'lost' ? -next.stake : 0;
  return next;
}

async function persistSportsBet(record, isEdit, updates = null) {
  if (SPORTS_BET_ENDPOINT && sportsLedgerMode === 'cloud') {
    const response = await authorizedFetch(SPORTS_BET_ENDPOINT, {
      method: isEdit ? 'PATCH' : 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Idempotency-Key': `${isEdit ? 'edit' : 'create'}:${record.id}:${Date.now()}`,
      },
      body: JSON.stringify(isEdit ? { id: record.id, updates: updates || record } : record),
    });
    const payload = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
  } else {
    const existing = sportsBetLedger.find(item => item.id === record.id);
    const next = deriveLocalSportsRecord({
      ...existing,
      ...(updates || record),
      analysis_snapshot: existing?.analysis_snapshot || record.analysis_snapshot,
    });
    sportsBetLedger = [...sportsBetLedger.filter(item => item.id !== record.id), next];
    localStorage.setItem('wc_sports_bets', JSON.stringify(sportsBetLedger));
  }
  await loadSportsBetLedger();
}

// ═══════════════════════════════════════════════
// Modal dialogs
// ═══════════════════════════════════════════════
// One helper behind all three modals. Native <dialog> handles focus trapping, Esc and
// top-layer stacking, so none of that is hand-rolled here.
//
// Teardown uses .remove() (no `close` event) while user-initiated closing uses .close()
// (fires `close`, which also covers Esc). Keeping those separate matters: the ROI editor
// resets module state in its close handler, and if the pre-emptive teardown fired a
// close event, that reset could land AFTER the new editor had already stored its state.
function openModalDialog(id, innerHTML, onClose) {
  document.getElementById(id)?.remove();
  const dialog = document.createElement('dialog');
  dialog.id = id;
  dialog.className = 'roi-modal-dialog';
  dialog.innerHTML = innerHTML;
  dialog._wcOnClose = onClose || null;
  document.body.appendChild(dialog);
  // The dialog fills the viewport, so anything outside the inner .roi-modal is the dim
  // area and targets the dialog element itself.
  dialog.addEventListener('click', event => { if (event.target === dialog) closeModalDialog(id); });
  // Esc: handled explicitly rather than via the native close request. Engines disagree
  // on which events a dismissal emits — measured in one engine here, close() sets
  // open=false and fires NEITHER `cancel` NOR `close` — which would leave the node in
  // the DOM and, for the ROI editor, its module state still set. preventDefault takes
  // the close request away from the browser so exactly one deterministic path runs.
  dialog.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault();
      closeModalDialog(id);
    }
  });
  // Still listened to, for engines that DO emit them (e.g. a dismissal we did not see).
  dialog.addEventListener('cancel', () => finishModalDialog(dialog));
  dialog.addEventListener('close', () => finishModalDialog(dialog));
  if (typeof dialog.showModal === 'function') dialog.showModal();
  return dialog;
}

// Idempotent teardown: whichever path gets here first removes the node and runs the
// cleanup exactly once, so an Esc-fired event and an explicit close cannot double-run it.
function finishModalDialog(dialog) {
  if (!dialog || dialog._wcFinished) return;
  dialog._wcFinished = true;
  const onClose = dialog._wcOnClose;
  dialog.remove();
  if (onClose) onClose();
}

function closeModalDialog(id) {
  const dialog = document.getElementById(id);
  if (!dialog) return;
  if (typeof dialog.close === 'function' && dialog.open) dialog.close();
  // Explicit, NOT left to the `close` event — that event is not reliably emitted.
  finishModalDialog(dialog);
}

async function saveSportsBet(event, id, isEdit) {
  event.preventDefault();
  const form = event.currentTarget;
  const values = Object.fromEntries(new FormData(form).entries());
  const existingRecord = sportsBetLedger.find(record => record.id === id);
  if (!existingRecord) return;
  const baseLegs = existingRecord.legs || [];
  const editedLegs = baseLegs.map((leg, index) => ({
    ...leg,
    status: values[`leg_status_${index}`] || leg.status || 'pending',
  }));
  const record = {
    ...existingRecord,
    legs: editedLegs,
    odds: Number(values.odds),
    status: values.status || existingRecord.status,
    note: existingRecord.note || '',
    settlement_source: (values.status || existingRecord.status) === 'pending' ? '' : 'manual_dashboard',
    settlement_reason: values.settlement_reason || '',
  };
  if (!(record.odds > 1)) {
    const error = document.getElementById('sportsBetError');
    error.style.display = 'block';
    error.textContent = '請輸入大過 1.00 嘅實際賠率。';
    return;
  }
  try {
    await persistSportsBet(record, true, {
      odds: record.odds,
      status: record.status,
      legs: record.legs,
      note: record.note,
      settlement_source: record.settlement_source,
      settlement_reason: record.settlement_reason,
    });
    closeSportsBetModal();
    activeSportsTab = 'bets';
    render();
  } catch (error) {
    const node = document.getElementById('sportsBetError');
    node.style.display = 'block';
    node.textContent = `儲存失敗：${error.message}`;
  }
}

  if (existing.status !== 'pending' && existing.status !== status) {
    reason = window.prompt('請輸入更正結果原因（會保存喺 audit log）：', '') || '';

      render();

      status,
      settlement_source: status === 'pending' ? '' : 'manual_dashboard',
      settlement_reason: status === 'pending' ? 'Reopened from dashboard' : reason,
    });

  } catch (error) {
    window.alert(`更新結果失敗：${error.message}`);

  }
}

async function updateSportsComboLegResult(encodedId, legIndex, status) {

function auditStatusChange(item) {
  const before = item.before?.status;
  const after = item.after?.status;
  if (before && after && before !== after) {
    return `${sportsStatusLabel(before)} → ${sportsStatusLabel(after)}`;
  }
  if (item.action === 'delete') return '記錄已刪除（D1 保留 audit trail）';
  return after ? `狀態：${sportsStatusLabel(after)}` : '已記錄操作';
}

function renderRaceDetail() {
  const m = selectedMeeting;
  const raceNum = currentRace;
  const racesData = getRacesData(m);
  if (!racesData) return '<div class="empty-state"><div class="empty-state__icon">🏇</div><div class="empty-state__text">No data</div></div>';

  const analysts = Object.keys(racesData.races_by_analyst);
  const analyses = {};
  const allMeetingRaces = [];
  const raceNums = new Set();
  
  for (const [aName, races] of Object.entries(racesData.races_by_analyst)) {
    const race = races.find(r => r.race_number === raceNum);
    if (race) analyses[aName] = race;
    races.forEach(r => { if (!raceNums.has(r.race_number)) { raceNums.add(r.race_number); allMeetingRaces.push(r); }});
  }
  allMeetingRaces.sort((a,b) => a.race_number - b.race_number);

  // Analysts who actually have data for THIS specific race
  const raceAnalysts = Object.keys(analyses);
  const displayAnalyst = activeAnalyst && analyses[activeAnalyst] ? activeAnalyst : raceAnalysts[0];
  const analysis = analyses[displayAnalyst];
  if (!analysis) return '<div class="empty-state"><div class="empty-state__icon">🏇</div><div class="empty-state__text">此場暫無分析數據</div></div>';

  // Only get consensus if both analysts have data for this race
  const consensus = raceAnalysts.length > 1 ? getConsensus(m, raceNum) : null;

  let html = `<div style="font-size:0.8rem;color:#64748B;margin-bottom:12px"><a href="#" onclick="showDashboard();return false">🏠 Dashboard</a> → ${esc(m.venue)} ${esc(m.date)} → Race ${raceNum}</div>`;

  // Race pills
  if (allMeetingRaces.length > 1) {
    html += '<div class="race-pills">';
    allMeetingRaces.forEach(r => {
      const isActive = r.race_number === raceNum;
      html += `<button class="race-pill ${isActive ? 'race-pill--active' : ''}" onclick="showRace(${r.race_number})">
        <span>R${r.race_number}</span>
        ${r.race_name ? `<span class="race-pill__name">${esc(r.race_name)}</span>` : ''}
        ${r.distance ? `<span class="race-pill__distance">${esc(r.distance)}</span>` : ''}
      </button>`;
    });
    html += '</div>';
  }

  // Race header
  html += `<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:4px">🏇 Race ${raceNum}${analysis.race_name ? `<span style="font-size:1rem;font-weight:600;color:#475569;margin-left:12px">${esc(analysis.race_name)}</span>` : ''}</h1>
      <div style="font-size:0.8rem;color:#64748B;line-height:1.6">${[analysis.distance, analysis.race_class, analysis.track || analysis.venue, analysis.going].filter(Boolean).map(esc).join(' · ')}</div>
    </div>`;

  // View mode tabs — only show if both analysts have data for THIS race
  if (raceAnalysts.length > 1) {
    html += `<div style="display:flex;gap:4px;background:#F1F5F9;border-radius:8px;padding:3px">
      <button class="${activeAnalyst === null ? 'btn btn--primary btn--sm' : 'btn btn--ghost btn--sm'}" onclick="setAnalyst(null)">📊 並排對比</button>`;
    raceAnalysts.forEach(a => {
      html += `<button class="${activeAnalyst === a ? 'btn btn--primary btn--sm' : 'btn btn--ghost btn--sm'}" onclick="setAnalyst('${a}')">${esc(a)}</button>`;
    });
    html += '</div>';
  }
  html += '</div>';

  // 🗺️ 戰場全景 — simple inline card before consensus
  if (analysis.battlefield_overview) {
    html += renderBattlefieldOverview(analysis.battlefield_overview, analysis.horses || []);
  } else if (analysis.pace_prediction) {
    html += `<div class="card" style="margin-bottom:16px;padding:12px 16px"><span style="font-size:0.75rem;font-weight:700;color:#64748B">🏃 步速預測</span><div style="font-size:0.85rem;margin-top:4px;white-space:pre-wrap">${esc(analysis.pace_prediction)}</div></div>`;
  }

  // Consensus panel
  if (consensus) {
    const top2 = (consensus.consensus?.consensus_horses || []).filter(h => h.is_top2_consensus);
    html += `<div class="consensus-panel"><div class="consensus-panel__title">🤝 共識馬匹 — Kelvin × Heison</div>`;
    if (!top2.length) {
      html += '<div style="padding:12px 16px;text-align:center;color:#94A3B8;font-size:0.85rem">本場沒有 Top 2 共識馬匹</div>';
    } else {
      top2.forEach(h => {
        html += `<div class="consensus-horse">
          <span style="background:#059669;color:#fff;width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:0.8rem;flex-shrink:0">${h.horse_number}</span>
          <span class="consensus-horse__name">${esc(h.horse_name)}</span>
          <div style="display:flex;gap:6px;align-items:center;font-size:0.75rem">
            <span style="color:#1D4ED8">K#${h.kelvin_rank}</span>${ratingBadge(h.kelvin_grade)}
            <span style="color:#64748B">·</span>
            <span style="color:#DC2626">H#${h.heison_rank}</span>${ratingBadge(h.heison_grade)}
          </div>
          <span class="badge badge--consensus">Top 2 共識</span>
        </div>`;
      });
    }
    html += '</div>';
  }


  // View modes — use raceAnalysts (analysts who have data for this race)
  if (activeAnalyst === null && raceAnalysts.length > 1) {
    html += renderComparisonView(analyses, raceAnalysts);
  } else {
    html += renderSingleAnalystView(analyses[displayAnalyst], displayAnalyst);
  }

  // Blind spots
  if (analysis.blind_spots) {
    html += `<div class="card" style="margin-top:24px"><h3 style="font-size:1rem;font-weight:700;margin-bottom:8px">🔮 盲區分析</h3><div style="font-size:0.85rem;color:#475569;line-height:1.7;white-space:pre-wrap">${formatAnalysis(analysis.blind_spots.slice(0, 1000))}</div></div>`;
  }

  // Betting panel
  try {
    html += renderBettingPanel(m, raceNum, raceAnalysts.length > 1, consensus);
  } catch (e) {
    html += `<div class="card" style="margin-top:24px"><h3 style="color:red">⚠️ 投注區域匯入失敗</h3><pre style="font-size:0.75rem">${e.message}</pre></div>`;
    console.error('BettingPanel error:', e);
  }

  return html;
}

function renderBetCard(c, m, raceNum) {
  const s = getBetState(m.date, m.venue, raceNum, c.horse_number);
  const A = `'${m.date}','${m.venue}',${raceNum},${c.horse_number}`;
  const cls = s.scratched ? 'bh bh--scratch' : s.confirmed ? 'bh bh--bet' : s.skipped ? 'bh bh--skip' : 'bh';
  let h = `<div class="${cls}">`;

  // Top row: horse info + grades + profit
  h += `<div class="bh-top"><div class="bh-info">`;
  h += renderSilk(c);
  h += `<div class="bh-num"><span class="bh-num-label">馬號</span><strong class="bh-num-value">${c.horse_number}</strong></div><div class="bh-copy">`;
  h += `<div class="bh-name">${esc(c.horse_name)}</div>`;
  if (c.horse_name_en) h += `<div class="bh-name-en">${esc(c.horse_name_en)}</div>`;
  h += `<div class="bh-meta">`;
  if (c.jockey) h += `<span class="bh-meta-item">\ud83c\udfc7 ${esc(c.jockey)}</span>`;
  if (c.trainer) h += `<span class="bh-meta-item">\ud83c\udfe0 ${esc(c.trainer)}</span>`;
  h += `</div>`;
  h += `</div></div>`;
  const statusMeta = s.scratched
    ? {label:'已退出', cls:'skip'}
    : s.skipped
      ? {label:'已選唔投', cls:'skip'}
      : s.confirmed
        ? (s.result === null || s.result === undefined ? {label:'待賽果', cls:'pending'} : {label:'已結算', cls:'settled'})
        : s.oddsConfirmed
          ? {label:'待決定', cls:'decision'}
          : {label:'輸入賠率', cls:'draft'};
  h += `<div class="bh-grades"><span class="bh-status bh-status--${statusMeta.cls}">${statusMeta.label}</span>${ratingBadge(String(c.kelvin_grade||c.grade||''))}${c.heison_grade?' '+ratingBadge(String(c.heison_grade)):''}`;
  h += `<button type="button" class="bh-analysis" onclick="showRace(${raceNum})">查看分析\u2192</button>`;
  const profit = calcProfit(s);
  if (profit !== null) {
    h += `<span class="bh-profit ${profit >= 0 ? 'bh-profit--win' : 'bh-profit--loss'}">${profit >= 0 ? '+' : ''}$${profit.toFixed(2)}</span>`;
  }
  h += `</div></div>`;

  if (s.scratched) {
    h += `<div class="bh-step"><div class="bh-step-row">`;
    h += `<span style="font-size:0.75rem;color:#64748B">\ud83d\udeab \u5df2\u9000\u51fa (Scratched)</span>`;
    h += `<button type="button" class="bb bb-restore" onclick="unscratchHorse(${A})">\u21a9\ufe0f \u5fa9\u539f</button>`;
    h += `</div></div>`;
  } else if (s.skipped) {
    h += `<div class="bh-step"><div class="bh-step-row">`;
    h += `<span style="font-size:0.75rem;color:#64748B">\u23ed\ufe0f \u5df2\u653e\u68c4\u6b64\u99ac${s.odds ? ' \u00b7 \u8ce0\u7387 @'+s.odds : ''}</span>`;
    h += `<button type="button" class="bb bb-reopen" onclick="reopenBet(${A})">\ud83d\udd04 \u91cd\u65b0\u8003\u616e</button>`;
    h += `</div></div>`;
  } else if (s.confirmed) {
    h += `<div class="bh-step">`;
    h += `<div class="bh-step-heading"><div class="bh-step-label">\ud83d\udcb0 \u5df2\u6295\u6ce8 \u00b7 \u8ce0\u7387 @${s.odds}</div>`;
    h += `<button type="button" class="bb bb-edit bb-edit--inline" onclick="unlockOdds(${A})">\u270f\ufe0f \u6539\u8ce0\u7387</button></div>`;
    h += `<div class="bh-step-row bh-step-row--result">`;
    h += `<span style="font-size:0.72rem;color:#94A3B8;margin-right:4px">\u540d\u6b21:</span>`;
    h += `<div class="br-group">`;
    ;[1,2,3].forEach(p => {
      h += `<button type="button" class="br${s.result===p?' br--on':''}" aria-label="第${p}名" onclick="setResult(${A},${p})">${p}</button>`;
    });
    h += `<button type="button" class="br br--x${s.result===0?' br--x-on':''}" aria-label="未能入位" onclick="setResult(${A},0)">X</button>`;
    h += `</div>`;
    h += `<button type="button" class="bb bb-scratch" onclick="scratchHorse(${A})" style="margin-left:8px">\ud83d\udeab \u5df2\u9000\u51fa</button>`;
    h += `</div></div>`;
  } else if (s.oddsConfirmed) {
    h += `<div class="bh-step">`;
    h += `<div class="bh-step-label">\u8ce0\u7387\u5df2\u78ba\u8a8d @${s.odds} \u2014 \u662f\u5426\u6295\u6ce8\uff1f</div>`;
    h += `<div class="bh-step-row">`;
    h += `<button type="button" class="bb bb-bet" onclick="placeBet(${A})">\ud83d\udcb0 \u78ba\u8a8d\u6295\u6ce8</button>`;
    h += `<button type="button" class="bb bb-skip" onclick="skipBet(${A})">\u23ed\ufe0f \u5514\u6295</button>`;
    h += `<button type="button" class="bb bb-edit" onclick="unlockOdds(${A})" style="margin-left:4px">\u270f\ufe0f \u6539\u8ce0\u7387</button>`;
    h += `</div></div>`;
  } else {
    h += `<div class="bh-step">`;
    const oddsLabelId = `odds-label-${raceNum}-${c.horse_number}`;
    h += `<div class="bh-step-label" id="${oddsLabelId}">\u2460 \u8f38\u5165\u8ce0\u7387</div>`;
    h += `<div class="bh-step-row">`;
    h += `<input class="bh-odds-input" type="number" name="odds-${raceNum}-${c.horse_number}" inputmode="decimal" autocomplete="off" step="0.1" min="1" placeholder="例如 2.5…" aria-labelledby="${oddsLabelId}" value="${s.odds ?? getMarketOdds(c, m, raceNum).place ?? ''}" oninput="setOddsValue(${A},this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();lockOdds(${A})}">`;
    h += `<button type="button" class="bb bb-lock" onclick="lockOdds(${A})">\ud83d\udd12 \u78ba\u8a8d\u8ce0\u7387</button>`;
    h += `</div></div>`;
  }

  h += '</div>';
  return h;
}

function renderMobileRoiRecord(b, mode = 'confirmed') {
  const grade = ratingBadge(String(b.grade || '')) + (b.heison ? ' ' + ratingBadge(String(b.heison)) : '');
  const horse = {horse_number:b.num, horse_name:b.name, horse_name_en:b.name_en, silk_url:b.silk_url};
  const jockey = b.jockey ? `<span class="roi-mobile-jockey"> \u00b7 ${esc(b.jockey)}</span>` : '';
  const englishName = b.name_en ? `<div class="roi-mobile-name-en" title="${esc(b.name_en)}">${esc(b.name_en)}</div>` : '';
  let resultLabel = '\u5f85\u8cfd\u679c';
  let resultClass = '';
  if (mode === 'skipped') {
    resultLabel = '\u5df2\u653e\u68c4';
    resultClass = ' roi-mobile-result--skip';
  } else if (b.result !== null && b.result !== undefined) {
    const won = b.result >= 1 && b.result <= 3;
    const resultText = won ? `\u7b2c${b.result}\u540d` : '\u672a\u5165\u4f4d';
    const profitText = b.profit !== null && b.profit !== undefined
      ? ` \u00b7 ${b.profit >= 0 ? '+' : ''}$${b.profit.toFixed(2)}`
      : '';
    resultLabel = resultText + profitText;
    resultClass = won ? ' roi-mobile-result--win' : ' roi-mobile-result--loss';
  }
  return `<div class="roi-mobile-item${mode === 'skipped' ? ' roi-mobile-item--skipped' : ''}">
    <div class="roi-mobile-silk">${renderSilk(horse, 'sm')}</div>
    <div class="roi-mobile-race">R${b.race}</div>
    <div class="roi-mobile-main">
      <div class="roi-mobile-name">#${b.num} \u00b7 ${esc(b.name)}${jockey}</div>
      ${englishName}
    </div>
    <div class="roi-mobile-side">
      <div class="roi-mobile-price">${grade}<span>@${b.odds || '\u2014'}</span></div>
      <div class="roi-mobile-result${resultClass}">${resultLabel}</div>
    </div>
  </div>`;
}

function renderDesktopRoiHorse(b) {
  const horse = {horse_number:b.num, horse_name:b.name, horse_name_en:b.name_en, silk_url:b.silk_url};
  return `<div class="roi-desktop-horse">
    ${renderSilk(horse, 'sm')}
    <div><div class="roi-desktop-horse-name">${esc(b.name)}</div>${b.name_en ? `<div class="roi-desktop-horse-name-en">${esc(b.name_en)}</div>` : ''}</div>
  </div>`;
}

function renderDashboardBettingPanel(meeting, races, isDualAnalyst) {
  const m = meeting;
  const allRC = [];
  races.forEach(race => {
    allRC.push({ rn: race.race_number, cands: getRaceBettingCandidates(m, race.race_number, isDualAnalyst), race });
  });

  let totalBets = 0, totalSettled = 0, totalProfit = 0;
  allRC.forEach(({rn, cands}) => cands.forEach(c => {
    const s = getBetState(m.date, m.venue, rn, c.horse_number);
    if (s.confirmed && !s.scratched) {
      totalBets++;
      const p = calcProfit(s);
      if (p !== null) { totalSettled++; totalProfit += p; }
    }
  }));

  let html = `<div class="bp">
    <div class="bp-hdr"><div class="bp-title">\ud83c\udfaf \u6295\u6ce8\u9762\u677f</div>
    <div class="bp-header-meta">${renderSyncStatus()}<span class="bp-sub">${isDualAnalyst ? 'Top 2 \u5171\u8b58\u99ac' : 'Top 2 \u7cbe\u9078'} \u00b7 $1 \u5e73\u6ce8\u5236</span></div></div>`;

  allRC.forEach(({rn, cands, race}) => {
    let rBets=0, rSettled=0, rProfit=0;
    cands.forEach(c => {
      const s = getBetState(m.date, m.venue, rn, c.horse_number);
      if (s.confirmed && !s.scratched) {
        rBets++;
        const p=calcProfit(s);
        if(p!==null) { rSettled++; rProfit+=p; }
      }
    });

    const isExp = expandedBetRaces.has(rn);
    const profitStr = rSettled > 0 ? `${rProfit >= 0 ? '+' : ''}$${rProfit.toFixed(2)}` : (rBets > 0 ? '待賽果' : '');
    const profitCls = rSettled > 0 ? (rProfit >= 0 ? 'bh-profit--win' : 'bh-profit--loss') : 'bh-profit--pending';

    html += `<div class="bp-race"><button type="button" class="bp-race-hdr" aria-expanded="${isExp}" onclick="toggleBetRace(${rn})">`;
    html += `<div><span class="bp-race-lbl">R${rn}</span><span class="bp-race-meta">${esc(race.distance||'')} ${esc(race.race_class||'')}</span>`;
    html += ` <span class="bp-race-stat">${cands.length} \u5019\u9078</span></div>`;
    html += `<div style="display:flex;align-items:center;gap:8px">`;
    if (rBets>0) html += `<span style="font-size:0.75rem;color:#94A3B8">${rBets}\u6ce8</span>`;
    if (profitStr) html += `<span class="bh-profit ${profitCls}" style="font-size:0.78rem">${profitStr}</span>`;
    html += `<span style="font-size:0.6rem;color:#475569">${isExp?'\u25b2':'\u25bc'}</span></div></button>`;

    if (isExp) {
      html += `<div class="bp-race-body">`;
      if (cands.length === 0) {
        html += `<div style="text-align:center;padding:16px;color:#475569;font-size:0.8rem">\u672c\u5834\u6c92\u6709\u5019\u9078\u99ac</div>`;
      } else {
        cands.forEach(c => { html += renderBetCard(c, m, rn); });
      }
      if (rBets > 0) {
        html += `<div class="bp-race-sum"><span class="bp-race-sum-lbl">\u5834\u6b21\u5c0f\u7d50 \u00b7 ${rBets}\u6ce8</span>`;
        html += `<span class="bh-profit ${profitCls}">${profitStr}</span></div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  });

  // Bottom bar (add bp-bar--fixed class for mobile sticky)
  html += `<div class="bp-bar bp-bar--fixed">`;
  html += `<div class="bp-bar-info">\u7e3d\u8a08 ${totalBets} \u6ce8${totalSettled > 0 ? ` \u00b7 \u6de8\u5229 <span class="bh-profit ${totalProfit >= 0 ? 'bh-profit--win' : 'bh-profit--loss'}">${totalProfit >= 0 ? '+' : ''}$${totalProfit.toFixed(2)}</span>` : (totalBets > 0 ? ' \u00b7 \u5f85\u8cfd\u679c' : '')}</div>`;
  html += `<button type="button" class="bp-bar-btn" onclick="commitBetsToDatabase()" ${totalBets===0?'disabled':''}>\ud83d\udce5 \u532f\u5165\u6295\u6ce8\u8a18\u9304</button>`;
  html += `</div>`;

  // ROI Summary Table
  const allConfirmed = [];
  const allSkipped = [];
  allRC.forEach(({rn, cands}) => {
    cands.forEach(c => {
      const s = getBetState(m.date, m.venue, rn, c.horse_number);
      if (s.confirmed && !s.scratched) {
        const p = calcProfit(s);
        allConfirmed.push({race:rn, num:c.horse_number, name:c.horse_name, name_en:c.horse_name_en, silk_url:c.silk_url, jockey:c.jockey, trainer:c.trainer, odds:s.odds, result:s.result, profit:p, grade:c.kelvin_grade||c.grade, heison:c.heison_grade});
      } else if (s.skipped) {
        allSkipped.push({race:rn, num:c.horse_number, name:c.horse_name, name_en:c.horse_name_en, silk_url:c.silk_url, jockey:c.jockey, trainer:c.trainer, odds:s.odds, grade:c.kelvin_grade||c.grade, heison:c.heison_grade});
      }
    });
  });
  if (allConfirmed.length > 0) {
    const settledBets = allConfirmed.filter(b => b.profit !== null);
    const pendingBets = allConfirmed.length - settledBets.length;
    const totalStake = settledBets.length;
    const totalPnl = allConfirmed.reduce((a,b) => a + (b.profit||0), 0);
    const wins = settledBets.filter(b => b.profit > 0).length;
    const losses = settledBets.length - wins;
    const roi = totalStake > 0 ? (totalPnl / totalStake * 100) : 0;
    html += `<div class="roi-sum">`;
    html += `<div class="roi-sum-hdr"><span>\ud83d\udcca \u6295\u6ce8\u8a18\u9304 \u00b7 ${m.venue} ${m.date}</span><span style="font-size:0.72rem;color:#6B7280;font-weight:500">${wins}W/${losses}L${pendingBets ? ` \u00b7 ${pendingBets} \u5f85\u8cfd\u679c` : ''} \u00b7 ROI ${roi>=0?'+':''}${roi.toFixed(1)}%</span></div>`;
    html += `<table class="roi-desktop-table"><thead><tr><th>\u5834\u6b21</th><th>\u99ac\u865f</th><th>\u99ac\u5339</th><th>\u9a0e\u5e2b</th><th>\u7df4\u99ac\u5e2b</th><th>\u8a55\u7d1a</th><th>\u8cde\u7387</th><th>\u540d\u6b21</th><th>\u6de8\u5229</th></tr></thead><tbody>`;
    allConfirmed.forEach(b => {
      const rStr = b.result === null ? '\u2014' : b.result === 0 ? 'X' : b.result;
      const pStr = b.profit !== null ? `<span style="color:${b.profit>=0?'#059669':'#DC2626'};font-weight:700">${b.profit>=0?'+':''}$${b.profit.toFixed(2)}</span>` : '<span style="color:#9CA3AF">\u2014</span>';
      const gStr = ratingBadge(String(b.grade||'')) + (b.heison ? ' '+ratingBadge(String(b.heison)) : '');
      html += `<tr><td>R${b.race}</td><td>#${b.num}</td><td>${renderDesktopRoiHorse(b)}</td><td style="font-size:0.68rem;color:#6B7280">${esc(b.jockey||'')}</td><td style="font-size:0.68rem;color:#6B7280">${esc(b.trainer||'')}</td><td>${gStr}</td><td>@${b.odds}</td><td style="font-weight:700">${rStr}</td><td>${pStr}</td></tr>`;
    });
    html += `<tr class="roi-sum-total"><td colspan="6" style="text-align:right">\u7e3d\u8a08 ${allConfirmed.length}\u6ce8</td><td></td><td>${wins}/${settledBets.length}${pendingBets ? ` \u00b7 ${pendingBets}\u5f85` : ''}</td><td><span style="color:${totalPnl>=0?'#059669':'#DC2626'}">${totalPnl>=0?'+':''}$${totalPnl.toFixed(2)}</span></td></tr>`;
    html += `</tbody></table><div class="roi-mobile-list">`;
    allConfirmed.forEach(b => { html += renderMobileRoiRecord(b); });
    html += `<div class="roi-mobile-total"><span>\u7e3d\u8a08 ${allConfirmed.length}\u6ce8 \u00b7 ${wins}/${settledBets.length}${pendingBets ? ` \u00b7 ${pendingBets}\u5f85` : ''}</span><span class="${totalPnl>=0?'bh-profit--win':'bh-profit--loss'}">${totalPnl>=0?'+':''}$${totalPnl.toFixed(2)}</span></div>`;
    html += `</div></div>`;
  }
  if (allSkipped.length > 0) {
    html += `<div class="roi-sum" style="margin-top:10px;opacity:0.7">`;
    html += `<div class="roi-sum-hdr" style="background:linear-gradient(135deg,#F9FAFB,#F3F4F6)"><span style="color:#6B7280">\u274c \u653e\u68c4\u99ac \u00b7 ${allSkipped.length} \u5339</span></div>`;
    html += `<table class="roi-desktop-table"><thead><tr><th>\u5834\u6b21</th><th>\u99ac\u865f</th><th>\u99ac\u5339</th><th>\u9a0e\u5e2b</th><th>\u7df4\u99ac\u5e2b</th><th>\u8a55\u7d1a</th><th>\u8cde\u7387</th></tr></thead><tbody>`;
    allSkipped.forEach(b => {
      const gStr = ratingBadge(String(b.grade||'')) + (b.heison ? ' '+ratingBadge(String(b.heison)) : '');
      html += `<tr style="color:#9CA3AF"><td>R${b.race}</td><td>#${b.num}</td><td>${renderDesktopRoiHorse(b)}</td><td style="font-size:0.68rem">${esc(b.jockey||'')}</td><td style="font-size:0.68rem">${esc(b.trainer||'')}</td><td>${gStr}</td><td>@${b.odds||'\u2014'}</td></tr>`;
    });
    html += `</tbody></table><div class="roi-mobile-list">`;
    allSkipped.forEach(b => { html += renderMobileRoiRecord(b, 'skipped'); });
    html += `</div></div>`;
  }

  html += `</div>`;
  return html;
}

function getRaceBettingCandidates(meeting, raceNum, isDualAnalyst) {
  const candidates = [];
  if (isDualAnalyst) {
    const consensus = getConsensus(meeting, raceNum);
    if (consensus) {
      const consensusHorses = consensus.consensus?.consensus_horses || [];
      consensusHorses.filter(h => h.is_top2_consensus).forEach(h => {
        let jockey = h.jockey || null;
        let trainer = h.trainer || null;
        let horseNameEn = h.horse_name_en || null;
        let horseCode = h.horse_code || null;
        let silkUrl = h.silk_url || null;
        const racesData = getRacesData(meeting);
        if (racesData && racesData.races_by_analyst && racesData.races_by_analyst['Kelvin']) {
           const kRace = racesData.races_by_analyst['Kelvin'].find(r => r.race_number === raceNum);
           if (kRace && kRace.horses) {
               const kHorse = kRace.horses.find(kh => kh.horse_number === h.horse_number);
               if (kHorse) {
                   jockey = kHorse.jockey || jockey;
                   trainer = kHorse.trainer || trainer;
                   horseNameEn = kHorse.horse_name_en || horseNameEn;
                   horseCode = kHorse.horse_code || horseCode;
                   silkUrl = kHorse.silk_url || silkUrl;
               }
           }
        }
        candidates.push({
          horse_number: h.horse_number, horse_name: h.horse_name,
          horse_name_en: horseNameEn,
          jockey: jockey, trainer: trainer,
          horse_code: horseCode, silk_url: silkUrl,
          kelvin_grade: h.kelvin_grade, heison_grade: h.heison_grade,
          grade: h.kelvin_grade || h.heison_grade, consensus_type: 'Top 2 \u5171\u8b58',
        });
      });
    }
  } else {
    const auConsensus = meeting?.region === 'au' ? getConsensus(meeting, raceNum) : null;
    const auConsensusHorses = auConsensus?.consensus?.consensus_horses || [];
    if (auConsensusHorses.length) {
      auConsensusHorses.forEach(h => {
        candidates.push({
          horse_number: h.horse_number,
          horse_name: h.horse_name,
          horse_name_en: h.horse_name_en || null,
          jockey: h.jockey || null,
          trainer: h.trainer || null,
          horse_code: h.horse_code || null,
          silk_url: h.silk_url || null,
          scenario: h.scenario || null,
          grade: h.kelvin_grade || h.heison_grade || null,
          kelvin_grade: h.kelvin_grade || null,
          heison_grade: null,
          consensus_type: h.consensus_type || 'Top 2 精選',
        });
      });
      return candidates;
    }
    const racesData = getRacesData(meeting);
    if (racesData) {
      const analysts = Object.keys(racesData.races_by_analyst);
      const race = racesData.races_by_analyst[analysts[0]]?.find(r => r.race_number === raceNum);
      // Use top_picks from parser (authoritative verdict), fallback to grade sort
      if (race?.top_picks?.length) {
        const horseMap = {};
        (race.horses || []).forEach(h => { horseMap[h.horse_number] = h; });
        race.top_picks.slice(0, 2).forEach(p => {
          const h = horseMap[p.horse_number] || {};
          candidates.push({
            horse_number: p.horse_number, horse_name: p.horse_name || h.horse_name || '?',
            horse_name_en: h.horse_name_en || null,
            jockey: h.jockey || null, trainer: h.trainer || null,
            horse_code: h.horse_code || null, silk_url: h.silk_url || null,
            grade: h.final_grade || p.grade, kelvin_grade: h.final_grade || p.grade, heison_grade: null,
            consensus_type: 'Top 2 \u7cbe\u9078',
          });
        });
      } else if (race?.horses?.length) {
        const top2 = [...race.horses]
          .filter(h => h.final_grade)
          .sort((a, b) => sortByGrade(a.final_grade, b.final_grade))
          .slice(0, 2);
        top2.forEach(h => {
          candidates.push({
            horse_number: h.horse_number, horse_name: h.horse_name,
            horse_name_en: h.horse_name_en || null,
            jockey: h.jockey || null, trainer: h.trainer || null,
            horse_code: h.horse_code || null, silk_url: h.silk_url || null,
            grade: h.final_grade, kelvin_grade: h.final_grade, heison_grade: null,
            consensus_type: 'Top 2 \u7cbe\u9078',
          });
        });
      }
    }
  }
  return candidates;
}
